# Otavix Launcher: the libraries and the ports. Paths are relative to the launcher's folder.
# repo: the port's GitHub repository; the launcher downloads and updates the port from its releases.
# platforms: the port's state on each system: ok (playable), beta (made and played, still in development), wip (in development, nothing to
# install), soon (planned); left out, not there.

[hub]
name = "Otavix Launcher"
version = "1.0.55"
update_repo = "otavix010/otavix-launcher"
accent = [220, 30, 38]

[servidor]
url = "https://otavix-launcher.otavix-launcher-servidor.workers.dev"  # reports, port requests and performance (servidor/LEIA-ME.md)

[[libraries]]
id = "xbox"
name = "Xbox"
accent = [16, 124, 16]

[[libraries]]
id = "x360"
name = "Xbox 360"
accent = [16, 124, 16]

[[libraries]]
id = "ps1"
name = "PlayStation 1"
accent = [150, 150, 160]

[[libraries]]
id = "ps2"
name = "PlayStation 2"
accent = [30, 70, 165]

[[libraries]]
id = "ps3"
name = "PlayStation 3"
accent = [0, 112, 209]

[[libraries]]
id = "ps4"
name = "PlayStation 4"
accent = [0, 112, 209]

[[libraries]]
id = "j2me"
name = { pt = "Celular (Java)", en = "Mobile (Java)", es = "Móvil (Java)" }
accent = [227, 120, 30]

[[games]]
id = "fifa-street-2"
library = "xbox"
path = "ports/fifa-street-2"
profile = "perfis/fifa-street-2.toml"
repo = "otavix010/fifa-street-2-pc"
platforms = { windows = "ok", linux = "soon" }

[[games]]
id = "gow-ascension"
library = "ps3"
# made on each PC from the port's code; the generator wants a path without spaces
path = "%SystemDrive%/OtavixPorts/gow-ascension"
profile = "perfis/gow-ascension.toml"
repo = "otavix010/gow-ascension-pc"
branch = "main"
platforms = { windows = "ok", linux = "soon" }

