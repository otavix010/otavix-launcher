[[options]]
page = "game"
key = "PS3_IDIOMA"
target = "env"
type = "choice"
default = "auto"
label = { pt = "Idioma", en = "Language", es = "Idioma" }
help = { pt = "O idioma do console, que o jogo segue nos textos e nas vozes. O disco das Américas (BCUS98232) tem inglês, francês, espanhol e português. Automático usa o idioma do Windows quando o disco tem, senão inglês. Vale depois de gerar o jogo com a versão de 27/10 ou mais nova.", en = "The console's language, which the game follows for text and voices. The Americas disc (BCUS98232) has English, French, Spanish and Portuguese. Automatic uses the Windows language when the disc has it, otherwise English. Takes effect once the game is generated with the 10/27 version or newer.", es = "El idioma de la consola, que el juego sigue en textos y voces. El disco de América (BCUS98232) tiene inglés, francés, español y portugués. Automático usa el idioma de Windows cuando el disco lo tiene; si no, inglés. Vale después de generar el juego con la versión del 27/10 o más nueva." }
choices = [
  { value = "auto", label = { pt = "Automático (idioma do Windows)", en = "Automatic (Windows language)", es = "Automático (idioma de Windows)" } },
  { value = "en", label = "English" },
  { value = "fr", label = "Français" },
  { value = "es", label = "Español" },
  { value = "pt-br", label = "Português (Brasil)" },
]

[[options]]
page = "audio"
key = "GOWA_AUDIO_BUFFER_MS"
target = "env"
type = "choice"
default = "100"
label = { pt = "Buffer de áudio", en = "Audio buffer", es = "Búfer de audio" }
help = { pt = "Quanto som fica guardado antes de tocar. 100 ms (o valor do RPCS3) evita os cortes quando o jogo fica lento; se ainda cortar, 200 ms. Em PCs que seguram os 60 fps, 20 ms deixa o som mais imediato.", en = "How much sound is kept ready before it plays. 100 ms (RPCS3's value) avoids cuts when the game slows down; if it still cuts out, 200 ms. On PCs that hold 60 fps, 20 ms makes the sound more immediate.", es = "Cuánto sonido se guarda antes de sonar. 100 ms (el valor de RPCS3) evita los cortes cuando el juego va lento; si todavía se corta, 200 ms. En PC que mantienen los 60 fps, 20 ms hace el sonido más inmediato." }
choices = [
  { value = "20", label = { pt = "20 ms (menor atraso, para PCs rápidos)", en = "20 ms (least delay, for fast PCs)", es = "20 ms (menor retraso, para PC rápidos)" } },
  { value = "50", label = "50 ms" },
  { value = "100", label = { pt = "100 ms (padrão)", en = "100 ms (default)", es = "100 ms (por defecto)" } },
  { value = "200", label = { pt = "200 ms (se ainda cortar)", en = "200 ms (if it still cuts out)", es = "200 ms (si todavía se corta)" } },
]

[[options]]
page = "controls"
key = "GOWA_TECLADO"
target = "env"
type = "choice"
default = "1"
label = { pt = "Teclado e mouse", en = "Keyboard and mouse", es = "Teclado y ratón" }
help = { pt = "Funciona junto com o controle, com a janela do jogo em foco. WASD move; espaço pula (✕); mouse esquerdo = ataque leve (□), direito = forte (△); E agarra (○); Shift + WASD esquiva; Q, F, C e R = L1, R1, L2 e R2; setas = direcional; Esc pausa; Tab = Select; Backspace volta nos menus. No jogo, F1 mostra e esconde a legenda das teclas. Para fechar: o X da janela ou Alt+F4.", en = "Works together with the controller, with the game's window focused. WASD moves; space jumps (✕); left mouse = light attack (□), right = heavy (△); E grabs (○); Shift + WASD dodges; Q, F, C and R = L1, R1, L2 and R2; arrows = d-pad; Esc pauses; Tab = Select; Backspace goes back in menus. In the game, F1 shows and hides the keys' legend. To close: the window's X or Alt+F4.", es = "Funciona junto con el mando, con la ventana del juego en foco. WASD mueve; espacio salta (✕); ratón izquierdo = ataque ligero (□), derecho = fuerte (△); E agarra (○); Shift + WASD esquiva; Q, F, C y R = L1, R1, L2 y R2; flechas = cruceta; Esc pausa; Tab = Select; Retroceso vuelve en los menús. En el juego, F1 muestra y oculta la leyenda de las teclas. Para cerrar: la X de la ventana o Alt+F4." }
choices = [
  { value = "1", label = { pt = "Ligado", en = "On", es = "Activado" } },
  { value = "0", label = { pt = "Desligado (só controle)", en = "Off (controller only)", es = "Desactivado (solo mando)" } },
]

[[options]]
page = "video"
key = "GOWA_TELA_CHEIA"
target = "env"
type = "choice"
default = "0"
label = { pt = "Modo de tela", en = "Display mode", es = "Modo de pantalla" }
help = { pt = "Janela ou tela cheia sem bordas. No jogo, F11 ou Alt+Enter alternam, e Esc sai da tela cheia. Por enquanto o jogo abre em janela: em alguns PCs, abrir direto em tela cheia fecha o jogo (correção a caminho); passar para tela cheia depois, com F11, funciona.", en = "A window or borderless fullscreen. In game, F11 or Alt+Enter switch, and Esc leaves fullscreen. For now the game starts in a window: on some PCs, starting straight in fullscreen closes the game (a fix is on its way); going fullscreen afterwards, with F11, works.", es = "Ventana o pantalla completa sin bordes. En el juego, F11 o Alt+Enter alternan, y Esc sale de la pantalla completa. Por ahora el juego abre en ventana: en algunos PC, abrir directo en pantalla completa cierra el juego (corrección en camino); pasar a pantalla completa después, con F11, funciona." }
choices = [
  { value = "1", label = { pt = "Tela cheia", en = "Fullscreen", es = "Pantalla completa" } },
  { value = "0", label = { pt = "Janela", en = "Window", es = "Ventana" } },
]

[[options]]
page = "video"
key = "GOWA_RES_SCALE"
target = "env"
type = "choice"
default = "1"
label = { pt = "Resolução", en = "Resolution", es = "Resolución" }
help = { pt = "A resolução em que o jogo desenha, em múltiplos dos 720p do PS3; a imagem é ajustada ao tamanho da janela. Mais alto deixa a imagem mais nítida e pede mais da placa de vídeo, não do processador. Numa tela 1080p, 1440p funciona como supersampling: desenha maior e reduz, com bordas mais limpas. Comece em 720p: quem limita este jogo é o processador (veja a página Desempenho), e só suba depois de ver como ele roda no seu PC.", en = "The resolution the game draws at, in multiples of the PS3's 720p; the picture is fitted to the window. Higher is sharper and asks more of the graphics card, not of the processor. On a 1080p screen, 1440p works as supersampling: it draws bigger and scales down, with cleaner edges. Start at 720p: what holds this game back is the processor (see the Performance page), and only go higher once you see how it runs on your PC.", es = "La resolución a la que el juego dibuja, en múltiplos de los 720p de PS3; la imagen se ajusta al tamaño de la ventana. Más alta es más nítida y exige más a la tarjeta gráfica, no al procesador. En una pantalla 1080p, 1440p funciona como supersampling: dibuja más grande y reduce, con bordes más limpios. Empieza en 720p: lo que limita este juego es el procesador (mira la página Rendimiento), y solo sube después de ver cómo corre en tu PC." }
choices = [
  { value = "1", label = { pt = "720p (PS3, mais leve)", en = "720p (PS3, lightest)", es = "720p (PS3, más ligera)" } },
  { value = "2", label = { pt = "1440p (supersampling em telas 1080p)", en = "1440p (supersampling on 1080p screens)", es = "1440p (supersampling en pantallas 1080p)" } },
  { value = "3", label = "4K (2160p)" },
  { value = "4", label = "5K (2880p)" },
]

