# God of War: Ascension (PS3) port: made on the player's PC. The launcher downloads the port's code (its main branch),
# the player points at their disc, the 1.04 update and the PS3 firmware, and the port's generator translates and
# compiles the game there (gerar.ps1). The game runs from the build the generator chose for the CPU.
[game]
title = "God of War: Ascension"
subtitle = { pt = "Port nativo do PS3 · recompilação estática", en = "Native PS3 port · static recompilation", es = "Port nativo de PS3 · recompilación estática" }
exe = ["port/build_native/gowa.exe", "port/build_nativerz/gowa.exe"]
workdir = "exe"
port_file = "gerar.ps1"
game_file = "jogo/GOWA.elf"
args = ["{dir}/jogo/GOWA.elf"]
env = { PS3_VFS_ROOT = "{dir}/vfs", PS3_LIBSRE_IMAGE = "{dir}/fw/lle/libsre_image.bin", PS3_SAVE_ROOT = "{dir}/saves" }
log_file = "out/jogo.log"
logs = "out"
saves = ["saves"]
accent = [196, 150, 60]
legal = { pt = "O port lê a sua própria cópia do jogo: nada do jogo vem com ele, o código é gerado no seu PC. God of War é marca da Sony Interactive Entertainment; este projeto não tem relação com ela.", en = "The port reads your own copy of the game: none of the game ships with it, the code is made on your PC. God of War is a trademark of Sony Interactive Entertainment; this project is not affiliated with it.", es = "El port lee tu propia copia del juego: nada del juego viene con él, el código se genera en tu PC. God of War es marca de Sony Interactive Entertainment; este proyecto no tiene relación con ella." }

# made on this PC by the port's generator, steps marked in out\gerar
[install]
kind = "build"
done = "out/gerar/7_jogar.ok"
marks = "out/gerar"
command = ["%SystemRoot%/System32/WindowsPowerShell/v1.0/powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "{dir}/gerar.ps1", "-Disco", "{disco}", "-Update", "{update}", "-Firmware", "{firmware}"]
redo = ["-RefazerDe", "4"]  # new code of the port: the PPU, SPU and build steps again, not the disc nor the firmware
version = { pt = "God of War: Ascension dos EUA (BCUS98232), o disco e o update 1.04", en = "God of War: Ascension, US (BCUS98232): the disc and the 1.04 update", es = "God of War: Ascension de EE. UU. (BCUS98232): el disco y el update 1.04" }
time = { pt = "Leva de 4 a 20 minutos, conforme o processador, e só uma vez. Precisa de uns 10 GB livres.", en = "It takes 4 to 20 minutes depending on the processor, and only once. About 10 GB free are needed.", es = "Tarda de 4 a 20 minutos según el procesador, y solo una vez. Hacen falta unos 10 GB libres." }

[[install.prereqs]]
name = "Python 3"
check = "python -c \"import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)\""
install = "winget install -e --id Python.Python.3.12 --accept-package-agreements --accept-source-agreements"
help = { pt = "Traduz o código do jogo. Depois de instalar, clique em Conferir de novo.", en = "It translates the game's code. Once installed, click Check again.", es = "Traduce el código del juego. Después de instalarlo, haz clic en Comprobar de nuevo." }

[[install.prereqs]]
name = "Visual Studio Build Tools (C++, Clang e CMake)"
check = "\"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath"
output = true
install = "winget install -e --id Microsoft.VisualStudio.2022.BuildTools --accept-package-agreements --accept-source-agreements --override \"--passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended\""
help = { pt = "Compila o jogo (uns 6 GB). Se o Build Tools já estiver instalado sem o Clang: abra o Visual Studio Installer, clique em Modificar e marque \"C++ Clang tools for Windows\" e \"C++ CMake tools\".", en = "It compiles the game (about 6 GB). If Build Tools is installed without Clang: open the Visual Studio Installer, click Modify and tick \"C++ Clang tools for Windows\" and \"C++ CMake tools\".", es = "Compila el juego (unos 6 GB). Si Build Tools ya está instalado sin Clang: abre el Visual Studio Installer, haz clic en Modificar y marca \"C++ Clang tools for Windows\" y \"C++ CMake tools\"." }

[[install.inputs]]
key = "disco"
pick = "both"
filters = ["7z", "zip", "rar", "iso"]
unpack = "PS3_GAME/PARAM.SFO"
label = { pt = "O disco (a pasta que contém PS3_GAME, ou o arquivo baixado)", en = "The disc (the folder holding PS3_GAME, or the downloaded file)", es = "El disco (la carpeta que contiene PS3_GAME, o el archivo descargado)" }
help = { pt = "Uma pasta: o port aponta para ela, não copia os 34 GB, então deixe-a onde está. Um arquivo .7z, .zip, .rar ou .iso (ou a pasta onde ele está): o launcher extrai na pasta do port antes de gerar; precisa de uns 35 GB livres no disco do port, e depois o arquivo baixado pode ser apagado. A .iso tem que ser a decriptada.", en = "A folder: the port points at it, it does not copy the 34 GB, so leave it where it is. A .7z, .zip, .rar or .iso file (or the folder holding it): the launcher unpacks it into the port's folder before making the game; it needs about 35 GB free on the port's drive, and the download can be deleted afterwards. The .iso must be the decrypted one.", es = "Una carpeta: el port apunta a ella, no copia los 34 GB, así que déjala donde está. Un archivo .7z, .zip, .rar o .iso (o la carpeta donde está): el launcher lo extrae en la carpeta del port antes de generar; necesita unos 35 GB libres en el disco del port, y luego la descarga se puede borrar. La .iso tiene que ser la descifrada." }

[[install.inputs]]
key = "update"
pick = "both"
filters = ["pkg"]
label = { pt = "O update 1.04 (opcional)", en = "The 1.04 update (optional)", es = "El update 1.04 (opcional)" }
help = { pt = "Se você não escolher nada, o gerador baixa o update 1.04 oficial do servidor da Sony (235 MB, grátis) e confere o arquivo. Se já tiver o .pkg do 1.04, ou a pasta BCUS98232 de um update 1.04 instalado no RPCS3, pode escolher aqui. Tem que ser a 1.04: a mais recente (1.09) não serve.", en = "If you pick nothing, the generator downloads the official 1.04 update from Sony's server (235 MB, free) and checks the file. If you already have the 1.04 .pkg, or the BCUS98232 folder of a 1.04 update installed in RPCS3, you can pick it here. It must be 1.04: the newest (1.09) does not work.", es = "Si no eliges nada, el generador descarga el update 1.04 oficial del servidor de Sony (235 MB, gratis) y comprueba el archivo. Si ya tienes el .pkg de la 1.04, o la carpeta BCUS98232 de un update 1.04 instalado en RPCS3, puedes elegirlo aquí. Tiene que ser la 1.04: la más reciente (1.09) no sirve." }
auto = { pt = "Automático: o gerador baixa da Sony (recomendado)", en = "Automatic: the generator downloads it from Sony (recommended)", es = "Automático: el generador lo descarga de Sony (recomendado)" }

[[install.inputs]]
key = "firmware"
pick = "both"
filters = ["pup", "sprx"]
label = { pt = "O firmware do PS3 (opcional)", en = "The PS3 firmware (optional)", es = "El firmware de PS3 (opcional)" }
help = { pt = "Se você não escolher nada, o gerador baixa o firmware oficial do site da PlayStation (PS3UPDAT.PUP, uns 200 MB, grátis) e tira dele só o que o jogo usa. Se já tiver baixado o PS3UPDAT.PUP, escolha o arquivo aqui; também servem a pasta do RPCS3 com o firmware instalado e o arquivo libsre.sprx.", en = "If you pick nothing, the generator downloads the official firmware from PlayStation's site (PS3UPDAT.PUP, about 200 MB, free) and takes from it only what the game uses. If you already downloaded PS3UPDAT.PUP, pick the file here; an RPCS3 folder with the firmware installed and the libsre.sprx file also work.", es = "Si no eliges nada, el generador descarga el firmware oficial del sitio de PlayStation (PS3UPDAT.PUP, unos 200 MB, gratis) y saca de él solo lo que usa el juego. Si ya descargaste el PS3UPDAT.PUP, elige el archivo aquí; también sirven la carpeta de RPCS3 con el firmware instalado y el archivo libsre.sprx." }
auto = { pt = "Automático: o gerador baixa do site da PlayStation (recomendado)", en = "Automatic: the generator downloads it from PlayStation's site (recommended)", es = "Automático: el generador lo descarga del sitio de PlayStation (recomendado)" }
links = [
  { label = { pt = "Firmware (site da PlayStation)", en = "Firmware (PlayStation's site)", es = "Firmware (sitio de PlayStation)" }, url = "https://www.playstation.com/pt-br/support/hardware/ps3/system-software/" },
]

[[install.steps]]
id = "1_ferramentas"
label = { pt = "ferramentas", en = "tools", es = "herramientas" }
[[install.steps]]
id = "2_jogo"
label = { pt = "arquivos do jogo", en = "the game's files", es = "archivos del juego" }
[[install.steps]]
id = "3_firmware"
label = { pt = "firmware", en = "firmware", es = "firmware" }
[[install.steps]]
id = "4_ppu"
label = { pt = "código da PPU", en = "the PPU's code", es = "código de la PPU" }
[[install.steps]]
id = "5_spu"
label = { pt = "código das SPUs", en = "the SPUs' code", es = "código de las SPU" }
[[install.steps]]
id = "6_compilar"
label = { pt = "compilando", en = "compiling", es = "compilando" }
[[install.steps]]
id = "7_jogar"
label = { pt = "pronto para jogar", en = "ready to play", es = "listo para jugar" }

# the official art, from the player's own disc once the game is made: the icon for the card, the background
[art]
kind = "image"
folder = "../arte/gow-ascension"
include = ["PS3_GAME/ICON0.PNG", "PS3_GAME/PIC1.PNG"]
card_only = 1
seconds = 12
trim = false
# public pictures (a store's box and background), until the player's copy gives its own
web = [
  "https://art.gametdb.com/ps3/coverHQ/US/BCUS98232.jpg",
]

[icon]
# the window's and the desktop shortcut's: the disc's ICON0
files = ["{disco}/PS3_GAME/ICON0.PNG", "PS3_GAME/ICON0.PNG"]

[[pages]]
id = "video"
advanced = true
label = { pt = "Vídeo", en = "Video", es = "Vídeo" }

[[options]]
page = "video"
key = "GOWA_TELA_CHEIA"
target = "env"
type = "choice"
default = "0"
label = { pt = "Modo de tela", en = "Display mode", es = "Modo de pantalla" }
help = { pt = "Janela ou tela cheia sem bordas. No jogo, F11 ou Alt+Enter alternam, e Esc sai da tela cheia. Por enquanto o jogo abre em janela: em alguns PCs, abrir direto em tela cheia fecha o jogo (correção a caminho); passar para tela cheia depois, com F11, funciona.", en = "A window or borderless fullscreen. In game, F11 or Alt+Enter switch, and Esc leaves fullscreen. For now the game starts in a window: on some PCs, starting straight in fullscreen closes the game (a fix is on its way); going fullscreen afterwards, with F11, works.", es = "Ventana o pantalla completa sin bordes. En el juego, F11 o Alt+Enter alternan, y Esc sale de la pantalla completa. Por ahora el juego abre en ventana: en algunos PC, abrir directo en pantalla completa cierra el juego (corrección en camino); pasar a pantalla completa después, con F11, funciona." }
choices = [
  { value = "1", label = { pt = "Tela cheia", en = "Fullscreen", es = "Pantalla completa" } },
  { value = "0", label = { pt = "Janela", en = "Window", es = "Ventana" } },
]

[[options]]
page = "video"
key = "GOWA_RES_SCALE"
target = "env"
type = "choice"
default = "1"
label = { pt = "Resolução", en = "Resolution", es = "Resolución" }
help = { pt = "A resolução em que o jogo desenha, em múltiplos dos 720p do PS3; a imagem é ajustada ao tamanho da janela. Mais alto deixa a imagem mais nítida e pede mais da placa de vídeo, não do processador. Numa tela 1080p, 1440p funciona como supersampling: desenha maior e reduz, com bordas mais limpas.", en = "The resolution the game draws at, in multiples of the PS3's 720p; the picture is fitted to the window. Higher is sharper and asks more of the graphics card, not of the processor. On a 1080p screen, 1440p works as supersampling: it draws bigger and scales down, with cleaner edges.", es = "La resolución a la que el juego dibuja, en múltiplos de los 720p de PS3; la imagen se ajusta al tamaño de la ventana. Más alta es más nítida y exige más a la tarjeta gráfica, no al procesador. En una pantalla 1080p, 1440p funciona como supersampling: dibuja más grande y reduce, con bordes más limpios." }
choices = [
  { value = "1", label = { pt = "720p (PS3, mais leve)", en = "720p (PS3, lightest)", es = "720p (PS3, más ligera)" } },
  { value = "2", label = { pt = "1440p (supersampling em telas 1080p)", en = "1440p (supersampling on 1080p screens)", es = "1440p (supersampling en pantallas 1080p)" } },
  { value = "3", label = "4K (2160p)" },
  { value = "4", label = "5K (2880p)" },
]

[[options]]
page = "video"
key = "PS3_WINDOW_MONITOR"
target = "env"
type = "choice"
default = "0"
label = { pt = "Monitor", en = "Monitor", es = "Monitor" }
choices = [
  { value = "0", label = { pt = "Principal", en = "Main", es = "Principal" } },
  { value = "2", label = { pt = "Secundário", en = "Second", es = "Secundario" } },
]

[[options]]
page = "video"
key = "GOWA_FLIP_HZ"
target = "env"
type = "choice"
default = "60"
label = { pt = "Taxa de quadros", en = "Frame rate", es = "Tasa de fotogramas" }
help = { pt = "O jogo foi feito para 30 e 60 fps. Acima de 60, parte da lógica dele avança por quadro e o jogo acelera: Ilimitado (até 240) serve só para medir o desempenho.", en = "The game was made for 30 and 60 fps. Above 60, part of its logic steps each frame and the game speeds up: Unlimited (up to 240) is only for measuring performance.", es = "El juego se hizo para 30 y 60 fps. Por encima de 60, parte de su lógica avanza por fotograma y el juego se acelera: Ilimitado (hasta 240) sirve solo para medir el rendimiento." }
choices = [
  { value = "30", label = "30 fps" },
  { value = "60", label = { pt = "60 fps (recomendado)", en = "60 fps (recommended)", es = "60 fps (recomendado)" } },
  { value = "0", label = { pt = "Ilimitado (acelera o jogo; só para teste)", en = "Unlimited (speeds the game up; testing only)", es = "Ilimitado (acelera el juego; solo para pruebas)" } },
]

[[options]]
page = "video"
key = "GOWA_FRAMEGEN"
target = "env"
type = "choice"
default = "0"
label = { pt = "Quadros intermediários", en = "In-between frames", es = "Fotogramas intermedios" }
help = { pt = "Gera um quadro entre cada dois do jogo, deixando o movimento mais fluido. Funciona melhor com o jogo acima de uns 40 fps.", en = "Makes a frame between every two of the game's, for smoother motion. Works best with the game above about 40 fps.", es = "Genera un fotograma entre cada dos del juego, con un movimiento más fluido. Funciona mejor con el juego por encima de unos 40 fps." }
choices = [
  { value = "0", label = { pt = "Desligado", en = "Off", es = "Desactivado" } },
  { value = "1", label = { pt = "Ligado", en = "On", es = "Activado" } },
]

[[options]]
page = "video"
key = "GOWA_MLAA_BYPASS"
target = "env"
type = "choice"
default = "1"
label = { pt = "Anti-aliasing do PS3 (MLAA)", en = "PS3 anti-aliasing (MLAA)", es = "Antialiasing de PS3 (MLAA)" }
help = { pt = "O MLAA original roda no processador. Desligado é mais rápido, principalmente em processadores sem AVX-512.", en = "The original MLAA runs on the processor. Off is faster, above all on processors without AVX-512.", es = "El MLAA original corre en el procesador. Desactivado es más rápido, sobre todo en procesadores sin AVX-512." }
choices = [
  { value = "1", label = { pt = "Desligado (mais rápido)", en = "Off (faster)", es = "Desactivado (más rápido)" } },
  { value = "0", label = { pt = "Ligado", en = "On", es = "Activado" } },
]

[[presets]]
label = { pt = "Leve", en = "Light", es = "Ligero" }
help = { pt = "720p, como no PS3. Para PCs mais modestos.", en = "720p, as on the PS3. For more modest PCs.", es = "720p, como en PS3. Para PCs más modestos." }
values = { GOWA_RES_SCALE = "1" }

[[presets]]
label = { pt = "Equilibrado", en = "Balanced", es = "Equilibrado" }
help = { pt = "1440p: bem mais nítido, para placas de vídeo médias.", en = "1440p: much sharper, for mid-range graphics cards.", es = "1440p: mucho más nítido, para tarjetas gráficas medias." }
values = { GOWA_RES_SCALE = "2" }

[[presets]]
label = { pt = "Máximo", en = "Maximum", es = "Máximo" }
help = { pt = "4K, para placas de vídeo fortes.", en = "4K, for strong graphics cards.", es = "4K, para tarjetas gráficas potentes." }
values = { GOWA_RES_SCALE = "3" }

