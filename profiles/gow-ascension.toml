]

[[options]]
page = "video"
key = "GOWA_VRR"
target = "env"
type = "toggle"
# off by default again (27/10, reports 90/93/103: a black screen with sound in the opening video on 120-180 Hz
# monitors since VRR came on by default); a player who wants it turns it on
default = false
label = { pt = "VRR (G-SYNC / FreeSync)", en = "VRR (G-SYNC / FreeSync)", es = "VRR (G-SYNC / FreeSync)" }
help = { pt = "Ligado, cada quadro vai para a tela assim que fica pronto: num monitor com G-SYNC ou FreeSync, uma queda de fps passa suave, sem engasgo. Num monitor sem VRR a imagem pode rasgar (tearing) em movimento; aí desligue, e o jogo espera a tela (vsync). Vale depois de gerar o jogo com a versão de 27/10 ou mais nova.", en = "On, each frame goes to the screen as soon as it is ready: on a G-SYNC or FreeSync monitor, a drop in fps stays smooth, without stutter. On a monitor without VRR the picture may tear in motion; then turn it off, and the game waits for the screen (vsync). Takes effect once the game is generated with the 10/27 version or newer.", es = "Activado, cada fotograma va a la pantalla en cuanto está listo: en un monitor con G-SYNC o FreeSync, una caída de fps se ve suave, sin tirones. En un monitor sin VRR la imagen puede cortarse (tearing) en movimiento; entonces desactívalo y el juego espera a la pantalla (vsync). Vale después de generar el juego con la versión del 27/10 o más nueva." }

[[options]]
page = "video"
key = "GOWA_PIN"
target = "env"
type = "choice"
default = ""
label = { pt = "Fixar as threads nos núcleos", en = "Pin threads to cores", es = "Fijar los hilos a los núcleos" }
help = { pt = "Põe cada parte pesada do jogo num núcleo só dela. Automático liga em processadores com 8 núcleos ou mais, onde costuma render alguns fps a mais. Em alguns processadores (APUs como o Ryzen 7 5700G, com menos cache) pode render menos: se o jogo estiver travando, teste Desligado na mesma cena e compare.", en = "Puts each heavy part of the game on a core of its own. Automatic turns it on with 8 cores or more, where it usually gives a few more fps. On some processors (APUs such as the Ryzen 7 5700G, with less cache) it may give less: if the game stutters, try Off in the same scene and compare.", es = "Pone cada parte pesada del juego en un núcleo propio. Automático lo activa con 8 núcleos o más, donde suele dar algunos fps más. En algunos procesadores (APU como el Ryzen 7 5700G, con menos caché) puede rendir menos: si el juego se traba, prueba Desactivado en la misma escena y compara." }
choices = [
  { value = "", label = { pt = "Automático (padrão)", en = "Automatic (default)", es = "Automático (por defecto)" } },
  { value = "0", label = { pt = "Desligado", en = "Off", es = "Desactivado" } },
  { value = "1", label = { pt = "Ligado", en = "On", es = "Activado" } },
]

[[options]]
page = "video"
key = "GOWA_FRAMEGEN"
target = "env"
type = "choice"
default = "0"
label = { pt = "Quadros intermediários (experimental)", en = "In-between frames (experimental)", es = "Fotogramas intermedios (experimental)" }
help = { pt = "Gera um quadro entre cada dois do jogo, deixando o movimento mais fluido. Só entra com o jogo acima de 30 fps; abaixo disso ficam só os quadros reais. Custa processador e pode borrar em movimento rápido: em PCs que não passam de 30 fps, deixe desligado.", en = "Makes a frame between every two of the game's, for smoother motion. It only kicks in with the game above 30 fps; below that, only the real frames show. It costs processor time and can blur fast motion: on PCs that do not get past 30 fps, leave it off.", es = "Genera un fotograma entre cada dos del juego, con un movimiento más fluido. Solo entra con el juego por encima de 30 fps; por debajo, solo los fotogramas reales. Cuesta procesador y puede emborronar el movimiento rápido: en PC que no pasan de 30 fps, déjalo desactivado." }
choices = [
  { value = "0", label = { pt = "Desligado", en = "Off", es = "Desactivado" } },
  { value = "1", label = { pt = "Ligado", en = "On", es = "Activado" } },
]

[[options]]
page = "video"
key = "GOWA_MLAA_BYPASS"
target = "env"
type = "choice"
default = "1"
label = { pt = "Anti-aliasing do PS3 (MLAA)", en = "PS3 anti-aliasing (MLAA)", es = "Antialiasing de PS3 (MLAA)" }
help = { pt = "O MLAA original roda no processador. Desligado é mais rápido, principalmente em processadores sem AVX-512.", en = "The original MLAA runs on the processor. Off is faster, above all on processors without AVX-512.", es = "El MLAA original corre en el procesador. Desactivado es más rápido, sobre todo en procesadores sin AVX-512." }
choices = [
  { value = "1", label = { pt = "Desligado (mais rápido)", en = "Off (faster)", es = "Desactivado (más rápido)" } },
  { value = "0", label = { pt = "Ligado", en = "On", es = "Activado" } },
]

[[options]]
page = "video"
key = "GOWA_TEX_WW"
target = "env"
type = "choice"
default = "1"
label = { pt = "Atualização de texturas", en = "Texture updates", es = "Actualización de texturas" }
help = { pt = "Rápido: o jogo só recarrega uma textura quando o Windows avisa que ela mudou. Se aparecerem texturas pretas, piscando ou com a cor errada (como as mãos do Kratos amarelas), troque para \"Conferir sempre\" e conte para a gente se resolveu: custa uns 5 a 10% a mais de processador.", en = "Fast: the game reloads a texture only when Windows reports that it changed. If textures show up black, flickering or in the wrong colour (like Kratos's yellow hands), switch to \"Always check\" and tell us whether it fixed it: it costs about 5 to 10% more processor time.", es = "Rápido: el juego solo recarga una textura cuando Windows avisa que cambió. Si aparecen texturas negras, parpadeando o con el color equivocado (como las manos amarillas de Kratos), cambia a \"Comprobar siempre\" y cuéntanos si se resolvió: cuesta un 5 a 10% más de procesador." }
choices = [
  { value = "1", label = { pt = "Rápido (padrão)", en = "Fast (default)", es = "Rápido (por defecto)" } },
  { value = "0", label = { pt = "Conferir sempre (mais compatível)", en = "Always check (more compatible)", es = "Comprobar siempre (más compatible)" } },
]

[[options]]
page = "video"
key = "GOWA_TEX_HASH_SAMPLE"
target = "env"
type = "choice"
default = "1024"
label = { pt = "Texturas grandes", en = "Large textures", es = "Texturas grandes" }
help = { pt = "Como o jogo confere se uma textura grande (acima de 1 MB) mudou: por amostra, mais rápido, ou inteira. Use \"Conferir inteiras\" junto com \"Conferir sempre\" acima se as texturas erradas continuarem.", en = "How the game checks whether a large texture (over 1 MB) changed: by sample, faster, or whole. Use \"Check whole\" together with \"Always check\" above if the wrong textures stay.", es = "Cómo el juego comprueba si una textura grande (más de 1 MB) cambió: por muestra, más rápido, o entera. Usa \"Comprobar enteras\" junto con \"Comprobar siempre\" arriba si las texturas erróneas siguen." }
choices = [
  { value = "1024", label = { pt = "Por amostra (padrão)", en = "By sample (default)", es = "Por muestra (por defecto)" } },
  { value = "0", label = { pt = "Conferir inteiras (mais lento)", en = "Check whole (slower)", es = "Comprobar enteras (más lento)" } },
]

[[presets]]
label = { pt = "Leve", en = "Light", es = "Ligero" }
help = { pt = "720p, como no PS3. Comece por aqui: o que pesa neste jogo é o processador.", en = "720p, as on the PS3. Start here: what weighs in this game is the processor.", es = "720p, como en PS3. Empieza por aquí: lo que pesa en este juego es el procesador." }
values = { GOWA_RES_SCALE = "1" }

[[presets]]
label = { pt = "1080p (60 fps)", en = "1080p (60 fps)", es = "1080p (60 fps)" }
help = { pt = "Desenha em 1440p: num monitor 1440p fica nativo e num 1080p é reduzido (supersampling), 60 fps reais, sem quadros intermediários. Só depois de ver o jogo rodar bem em 720p. Os 60 pedem um processador forte; se não segurar, use o Leve.", en = "Draws at 1440p: native on a 1440p monitor, brought down on a 1080p one (supersampling), real 60 fps, no in-between frames. Only once the game runs well at 720p. 60 needs a strong processor; if it doesn't hold, use Light.", es = "Dibuja a 1440p: nativo en un monitor 1440p y reducido en uno 1080p (supersampling), 60 fps reales, sin fotogramas intermedios. Solo después de ver el juego ir bien a 720p. Los 60 piden un procesador potente; si no aguanta, usa Ligero." }
values = { GOWA_RES_SCALE = "2", GOWA_FLIP_HZ = "60", GOWA_FRAMEGEN = "0" }

[[presets]]
label = { pt = "Máximo", en = "Maximum", es = "Máximo" }
help = { pt = "4K: pede processador e placa de vídeo fortes. Num processador mais fraco, só piora.", en = "4K: needs a strong processor and graphics card. On a weaker processor it only gets worse.", es = "4K: pide procesador y tarjeta gráfica potentes. En un procesador más débil solo empeora." }
values = { GOWA_RES_SCALE = "3" }

