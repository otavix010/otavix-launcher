# God of War: Chains of Olympus (PSP) port: made on the player's PC by the port's generator (gerar.ps1 of otavix010/gow-chains-pc, the same
# repository for Chains of Olympus and Ghost of Sparta: -Jogo picks it), from their own UMD image (.iso, US UCUS-98653).
# The Otavix Engine PSP (private) comes compiled; the game's code is translated and compiled on the PC. Beta (0.1.0).
# Everything goes by environment: PSP_* (engine 0.1.1+). The game reads the ISO while it runs.
[game]
title = "God of War: Chains of Olympus"
subtitle = { pt = "Port nativo do PSP · recompilação estática", en = "Native PSP port · static recompilation", es = "Port nativo de PSP · recompilación estática" }
status = "beta"
status_text = { pt = "Beta", en = "Beta", es = "Beta" }
exe = "bin/gow-chains-of-olympus.exe"
port_file = "gerar.ps1"
args = ["{iso}", "{dir}/bin/imagem.bin"]
env = { PSP_LOG = "{dir}/out/psp.log", PSP_MS0 = "{dir}/ms0", PSP_PGD = "{dir}/bin/pgd" }
log_file = "out/jogo.log"  # the console (stdout/stderr); the engine's own log is out/psp.log (PSP_LOG)
logs = "out"
saves = ["ms0"]
accent = [150, 40, 30]
legal = { pt = "O port lê a sua própria cópia do jogo: nada do jogo vem com ele, o código é gerado no seu PC. God of War é marca da Sony Interactive Entertainment; este projeto não tem relação com ela.", en = "The port reads your own copy of the game: none of the game ships with it, the code is made on your PC. God of War is a trademark of Sony Interactive Entertainment; this project is not affiliated with it.", es = "El port lee tu propia copia del juego: nada del juego viene con él, el código se genera en tu PC. God of War es marca de Sony Interactive Entertainment; este proyecto no tiene relación con ella." }

[performance]
note = { pt = "God of War: Chains of Olympus roda a 60 quadros por segundo num PC atual, num notebook com GTX 1650 e na Legion Go S pelo Proton. O desenho é pela placa de vídeo (Direct3D 11): a resolução interna é o que mais pesa nela.", en = "God of War: Chains of Olympus runs at 60 frames per second on a current PC, on a laptop with a GTX 1650 and on the Legion Go S through Proton. Drawing is done by the graphics card (Direct3D 11): the internal resolution is what weighs most on it.", es = "God of War: Chains of Olympus va a 60 cuadros por segundo en un PC actual, en un portátil con GTX 1650 y en la Legion Go S mediante Proton. El dibujo lo hace la tarjeta gráfica (Direct3D 11): la resolución interna es lo que más le pesa." }

# pictures in arte/gow-chains-of-olympus when there are (capa, the library card; fundo, the page), else the public ones (libretro)
[art]
kind = "image"
folder = "../arte/gow-chains-of-olympus"
include = ["capa.png", "capa.jpg", "fundo.png", "fundo.jpg", "fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"]
card_only = 1
seconds = 12
trim = false
web = [
  "https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/gow-chains-of-olympus/capa.png",
  "https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/gow-chains-of-olympus/titulo.png",
  "https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/gow-chains-of-olympus/cena.png",
]

[install]
kind = "build"
done = "out/gerar/6_jogar.ok"
marks = "out/gerar"
command = ["%SystemRoot%/System32/WindowsPowerShell/v1.0/powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "{dir}/gerar.ps1", "-Iso", "{iso}", "-Jogo", "coo"]
redo = ["-RefazerDe", "3"]  # new engine or port code: the engine, the translation and the build again, not the disc
version = { pt = "God of War: Chains of Olympus dos EUA (UCUS-98653): a imagem .iso do UMD", en = "God of War: Chains of Olympus, US (UCUS-98653): the UMD's .iso image", es = "God of War: Chains of Olympus de EE. UU. (UCUS-98653): la imagen .iso del UMD" }
time = { pt = "Leva menos de um minuto num PC atual (alguns minutos num mais fraco), e só uma vez. Baixa o Python embutido (11 MB), o FFmpeg (75 MB) e a engine do port (menos de 1 MB); não instala Python nem Git.", en = "It takes under a minute on a current PC (a few minutes on a weaker one), and only once. It downloads an embedded Python (11 MB), FFmpeg (75 MB) and the port's engine (under 1 MB); it installs neither Python nor Git.", es = "Tarda menos de un minuto en un PC actual (unos minutos en uno más débil), y solo una vez. Descarga un Python integrado (11 MB), FFmpeg (75 MB) y el motor del port (menos de 1 MB); no instala Python ni Git." }

[[install.prereqs]]
name = "Visual Studio Build Tools (C++ e Clang)"
# a Visual Studio with the full C++ tools AND Clang (a VS 2026 with only the Clang component is not enough): encoded PowerShell, no quoting trouble
check = "powershell -NoProfile -EncodedCommand "
output = true
install = "powershell -NoProfile -EncodedCommand  || (where winget >nul 2>&1 && winget install -e --id Microsoft.VisualStudio.2022.BuildTools --accept-package-agreements --accept-source-agreements --override \"--passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended\") || (echo Sem o winget: baixando o instalador oficial da Microsoft... && curl -L --fail -o \"%TEMP%\\vs_BuildTools.exe\" https://aka.ms/vs/17/release/vs_BuildTools.exe && \"%TEMP%\\vs_BuildTools.exe\" --passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended)"
help = { pt = "Compila o jogo (o Build Tools ocupa uns 6 GB). Se ele já estiver instalado sem o Clang: abra o Visual Studio Installer, clique em Modificar e marque \"C++ Clang tools for Windows\".", en = "It compiles the game (Build Tools takes about 6 GB). If it is installed without Clang: open the Visual Studio Installer, click Modify and tick \"C++ Clang tools for Windows\".", es = "Compila el juego (Build Tools ocupa unos 6 GB). Si ya está instalado sin Clang: abre el Visual Studio Installer, haz clic en Modificar y marca \"C++ Clang tools for Windows\"." }

[[install.inputs]]
key = "iso"
pick = "both"
filters = ["7z", "zip", "rar", "iso"]
unpack = "*.iso"
disc_id = "UCUS-98653"
label = { pt = "A imagem do UMD (.iso, ou o .7z/.zip/.rar baixado)", en = "The UMD image (.iso, or the downloaded .7z/.zip/.rar)", es = "La imagen del UMD (.iso, o el .7z/.zip/.rar descargado)" }
help = { pt = "Tem que ser a versão dos EUA (UCUS-98653). O gerador confere o disco e o executável do jogo e avisa se for outra versão. Um .cso comprimido não serve: descomprima para .iso. O jogo lê a ISO enquanto roda: deixe-a onde está. Um arquivo .7z, .zip ou .rar com a .iso dentro também serve: o launcher extrai a .iso na pasta do port antes de gerar.", en = "It must be the US release (UCUS-98653). The generator checks the disc and the game's executable and says so when it is another version. A compressed .cso does not work: decompress it to .iso. The game reads the ISO while it runs: leave it where it is. A .7z, .zip or .rar holding the .iso works too: the launcher unpacks the .iso into the port's folder before making the game.", es = "Tiene que ser la versión de EE. UU. (UCUS-98653). El generador comprueba el disco y el ejecutable del juego y avisa si es otra versión. Un .cso comprimido no sirve: descomprímelo a .iso. El juego lee la ISO mientras se ejecuta: déjala donde está. Un archivo .7z, .zip o .rar con la .iso dentro también sirve: el launcher extrae la .iso en la carpeta del port antes de generar." }

