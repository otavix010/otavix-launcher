# Drakengard (PlayStation 2) port: listed in the hub while it is made (no generator yet; the European SLES-52322)
[game]
title = "Drakengard"
subtitle = { pt = "Port nativo do PlayStation 2 · recompilação estática", en = "Native PlayStation 2 port · static recompilation", es = "Port nativo de PlayStation 2 · recompilación estática" }
status = "wip"
status_text = { pt = "Em desenvolvimento", en = "In development", es = "En desarrollo" }
exe = "drakengard.exe"
accent = [140, 30, 30]
legal = { pt = "O port lê a sua própria cópia do jogo. Drakengard é marca dos seus donos; este projeto não tem relação com eles.", en = "The port reads your own copy of the game. Drakengard is a trademark of its owners; this project is not affiliated with them.", es = "El port lee tu propia copia del juego. Drakengard es marca de sus dueños; este proyecto no tiene relación con ellos." }

# pictures in arte/drakengard when there are (capa, the library card; fundo, the page), else the public ones (libretro)
[art]
kind = "image"
folder = "../arte/drakengard"
