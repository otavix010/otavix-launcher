# Dirge of Cerberus: Final Fantasy VII (PlayStation 2) port: listed in the hub while it is made (no generator yet; the European SLES-54185)
[game]
title = "Dirge of Cerberus: Final Fantasy VII"
subtitle = { pt = "Port nativo do PlayStation 2 · recompilação estática", en = "Native PlayStation 2 port · static recompilation", es = "Port nativo de PlayStation 2 · recompilación estática" }
status = "wip"
status_text = { pt = "Em desenvolvimento", en = "In development", es = "En desarrollo" }
exe = "dirge-of-cerberus.exe"
accent = [165, 25, 35]
legal = { pt = "O port lê a sua própria cópia do jogo. Dirge of Cerberus: Final Fantasy VII é marca dos seus donos; este projeto não tem relação com eles.", en = "The port reads your own copy of the game. Dirge of Cerberus: Final Fantasy VII is a trademark of its owners; this project is not affiliated with them.", es = "El port lee tu propia copia del juego. Dirge of Cerberus: Final Fantasy VII es marca de sus dueños; este proyecto no tiene relación con ellos." }

