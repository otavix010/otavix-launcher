# Castlevania: Lament of Innocence (PlayStation 2) port: listed in the hub while it is made (no generator yet; the American SLUS-20733)
[game]
title = "Castlevania: Lament of Innocence"
subtitle = { pt = "Port nativo do PlayStation 2 · recompilação estática", en = "Native PlayStation 2 port · static recompilation", es = "Port nativo de PlayStation 2 · recompilación estática" }
status = "wip"
status_text = { pt = "Em desenvolvimento", en = "In development", es = "En desarrollo" }
exe = "castlevania-lament-of-innocence.exe"
accent = [120, 25, 45]
legal = { pt = "O port lê a sua própria cópia do jogo. Castlevania: Lament of Innocence é marca dos seus donos; este projeto não tem relação com eles.", en = "The port reads your own copy of the game. Castlevania: Lament of Innocence is a trademark of its owners; this project is not affiliated with them.", es = "El port lee tu propia copia del juego. Castlevania: Lament of Innocence es marca de sus dueños; este proyecto no tiene relación con ellos." }

# pictures in arte/castlevania-lament-of-innocence when there are (capa, the library card; fundo, the page), else the public ones (libretro)
[art]
kind = "image"
folder = "../arte/castlevania-lament-of-innocence"
include = ["capa.png", "capa.jpg", "fundo.png", "fundo.jpg", "fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"]
card_only = 1
seconds = 12
trim = false
web = [
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Boxarts/Castlevania%20-%20Lament%20of%20Innocence%20%28USA%29.png",
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Titles/Castlevania%20-%20Lament%20of%20Innocence%20%28USA%29.png",
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Snaps/Castlevania%20-%20Lament%20of%20Innocence%20%28USA%29.png",
]

# the window's and the desktop shortcut's: a miniature of the box art (libretro)
[icon]
kind = "image"
web = ["https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Boxarts/Castlevania%20-%20Lament%20of%20Innocence%20%28USA%29.png"]
