# Castlevania: Lament of Innocence (PlayStation 2) port: made on the player's PC by the port's generator (gerar.ps1 of otavix010/castlevania-lament-of-innocence-pc),
# from their own DVD image (the US SLUS-20733). The game's own variables (jogo.json "ambiente") go in bin\ambiente.txt,
# which the runtime reads; the launcher only passes the disc and the menu's options. Beta (first release 0.1.0).
[game]
title = "Castlevania: Lament of Innocence"
subtitle = { pt = "Port nativo do PlayStation 2 · recompilação estática", en = "Native PlayStation 2 port · static recompilation", es = "Port nativo de PlayStation 2 · recompilación estática" }
status = "beta"
status_text = { pt = "Beta", en = "Beta", es = "Beta" }
exe = "bin/castlevania-lament-of-innocence.exe"
workdir = "trabalho/disc"  # as jogar.cmd: the game opens its files from the disc's folder
port_file = "gerar.ps1"
args = ["{dir}/trabalho/disc/SLUS_207.33"]
# the ISO picked when making it (the game reads its sectors) and the disc's files; the rest comes from bin\ambiente.txt
env = { PS2X_CD_IMAGE = "{iso}", PS2X_CD_ROOT = "{dir}/trabalho/disc" }
log_file = "out/jogo.log"
logs = "out"
accent = [120, 25, 45]
legal = { pt = "O port lê a sua própria cópia do jogo. Castlevania: Lament of Innocence é marca dos seus donos; este projeto não tem relação com eles.", en = "The port reads your own copy of the game. Castlevania: Lament of Innocence is a trademark of its owners; this project is not affiliated with them.", es = "El port lee tu propia copia del juego. Castlevania: Lament of Innocence es marca de sus dueños; este proyecto no tiene relación con ellos." }

[performance]
note = { pt = "Castlevania: Lament of Innocence roda a 60 fps num PC atual. O que mais pesa é o processador: o port traduz o código do PlayStation 2 (incluindo o processador de geometria, o VU1) para o seu PC.", en = "Castlevania: Lament of Innocence runs at 60 fps on a current PC. What weighs most is the processor: the port translates the PlayStation 2's code (including its geometry processor, the VU1) for your PC.", es = "Castlevania: Lament of Innocence va a 60 fps en un PC actual. Lo que más pesa es el procesador: el port traduce el código de PlayStation 2 (incluido su procesador de geometría, la VU1) para tu PC." }

# pictures in arte/castlevania-lament-of-innocence when there are (capa, the library card; fundo, the page), else the public ones (libretro)
[art]
kind = "image"
folder = "../arte/castlevania-lament-of-innocence"
include = ["capa.png", "capa.jpg", "fundo.png", "fundo.jpg", "fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"]
card_only = 1
seconds = 12
trim = false
web = [
  "https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/castlevania-lament-of-innocence/capa.png",
  "https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/castlevania-lament-of-innocence/titulo.png",
  "https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/castlevania-lament-of-innocence/cena.png",
]

[install]
kind = "build"
done = "out/gerar/7_jogar.ok"
marks = "out/gerar"
command = ["%SystemRoot%/System32/WindowsPowerShell/v1.0/powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "{dir}/gerar.ps1", "-Iso", "{iso}"]
redo = ["-RefazerDe", "3"]  # new engine or port code: the engine, the translation, the VU1 and the build again, not the disc
version = { pt = "Castlevania: Lament of Innocence dos EUA (SLUS-20733): a imagem .iso do DVD do PlayStation 2", en = "Castlevania: Lament of Innocence, US (SLUS-20733): the PlayStation 2 DVD's .iso image", es = "Castlevania: Lament of Innocence de EE. UU. (SLUS-20733): la imagen .iso del DVD de PlayStation 2" }
time = { pt = "Leva de alguns minutos a meia hora, conforme o processador, e só uma vez. Baixa o motor do port (uns 16 MB); não precisa de Python nem de Git.", en = "It takes from a few minutes to half an hour depending on the processor, and only once. It downloads the port's engine (about 16 MB); no Python or Git needed.", es = "Tarda de unos minutos a media hora según el procesador, y solo una vez. Descarga el motor del port (unos 16 MB); no necesita Python ni Git." }

[[install.prereqs]]
name = "Visual Studio Build Tools (C++ e CMake)"
check = "\"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.CMake.Project -property installationPath"
output = true
install = "powershell -NoProfile -EncodedCommand  || (where winget >nul 2>&1 && winget install -e --id Microsoft.VisualStudio.2022.BuildTools --accept-package-agreements --accept-source-agreements --override \"--passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended\") || (echo Sem o winget: baixando o instalador oficial da Microsoft... && curl -L --fail -o \"%TEMP%\\vs_BuildTools.exe\" https://aka.ms/vs/17/release/vs_BuildTools.exe && \"%TEMP%\\vs_BuildTools.exe\" --passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended)"
help = { pt = "Compila o jogo (uns 6 GB). Se o Build Tools já estiver instalado sem o CMake: abra o Visual Studio Installer, clique em Modificar e marque \"C++ CMake tools\".", en = "It compiles the game (about 6 GB). If Build Tools is installed without CMake: open the Visual Studio Installer, click Modify and tick \"C++ CMake tools\".", es = "Compila el juego (unos 6 GB). Si Build Tools ya está instalado sin CMake: abre el Visual Studio Installer, haz clic en Modificar y marca \"C++ CMake tools\"." }

[[install.inputs]]
key = "iso"
pick = "both"
filters = ["7z", "zip", "rar", "iso", "bin", "img"]
unpack = "*.iso"
disc_id = "SLUS-20733"
label = { pt = "A imagem do DVD (.iso, ou o .7z/.zip/.rar baixado)", en = "The DVD image (.iso, or the downloaded .7z/.zip/.rar)", es = "La imagen del DVD (.iso, o el .7z/.zip/.rar descargado)" }
help = { pt = "Tem que ser a versão dos EUA (SLUS-20733). O gerador confere o executável do jogo e avisa se for outra versão. O jogo lê a ISO enquanto roda: deixe-a onde está. Um arquivo .7z, .zip ou .rar com a .iso dentro (ou a pasta onde ele está) também serve: o launcher extrai a .iso na pasta do port antes de gerar.", en = "It must be the US release (SLUS-20733). The generator checks the game's executable and says so when it is another version. The game reads the ISO while it runs: leave it where it is. A .7z, .zip or .rar holding the .iso (or the folder it is in) works too: the launcher unpacks the .iso into the port's folder before making the game.", es = "Tiene que ser la versión de EE. UU. (SLUS-20733). El generador comprueba el ejecutable del juego y avisa si es otra versión. El juego lee la ISO mientras se ejecuta: déjala donde está. Un archivo .7z, .zip o .rar con la .iso dentro (o la carpeta donde está) también sirve: el launcher extrae la .iso en la carpeta del port antes de generar." }

