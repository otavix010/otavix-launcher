default = "auto"
label = { pt = "Distribuir as threads nos núcleos", en = "Spread threads across cores", es = "Distribuir los hilos en los núcleos" }
help = { pt = "Em processadores de 4 a 6 núcleos com Hyper-Threading/SMT, indica a cada parte pesada do jogo um núcleo físico preferido, sem prendê-la: se esse núcleo estiver ocupado por outro programa, o Windows a move. Em processadores maiores não muda nada. Se o jogo engasgar, teste Desligado.", en = "On processors with 4 to 6 cores and Hyper-Threading/SMT, gives each heavy part of the game a preferred physical core without pinning it: if that core is busy with another program, Windows moves it. On bigger processors it changes nothing. If the game stutters, try Off.", es = "En procesadores de 4 a 6 núcleos con Hyper-Threading/SMT, indica a cada parte pesada del juego un núcleo físico preferido, sin fijarla: si ese núcleo está ocupado por otro programa, Windows la mueve. En procesadores más grandes no cambia nada. Si el juego se traba, prueba Desactivado." }
choices = [
  { value = "auto", label = { pt = "Automático (padrão)", en = "Automatic (default)", es = "Automático (por defecto)" } },
  { value = "0", label = { pt = "Desligado", en = "Off", es = "Desactivado" } },
]

