key = "PS2X_JANELA_TAM"
target = "env"
type = "choice"
default = "1280x720"
label = { pt = "Tamanho da janela", en = "Window size", es = "Tamaño de la ventana" }
help = { pt = "O tamanho em que a janela abre (em tela cheia vale a resolução do monitor). O jogo desenha na resolução do PlayStation 2 (ou na Resolução interna escolhida abaixo) e a imagem é ampliada até a janela: para a ampliação ficar mais nítida, use o Escalonador abaixo.", en = "The size the window opens at (in fullscreen, the monitor's resolution is used). The game draws at the PlayStation 2's resolution (or at the Internal resolution chosen below) and the picture is enlarged to the window: for a sharper enlargement, use the Upscaler below.", es = "El tamaño con el que se abre la ventana (en pantalla completa vale la resolución del monitor). El juego dibuja a la resolución de PlayStation 2 (o a la Resolución interna elegida abajo) y la imagen se amplía hasta la ventana: para una ampliación más nítida, usa el Escalador de abajo." }
choices = [
  { value = "1280x720", label = "1280 × 720" },
  { value = "1600x900", label = "1600 × 900" },
  { value = "1920x1080", label = "1920 × 1080" },
  { value = "2560x1440", label = "2560 × 1440" },
  { value = "3840x2160", label = "3840 × 2160" },
]

[[options]]
page = "video"
key = "PS2X_RESOLUCAO"
target = "env"
type = "choice"
default = "1"
label = { pt = "Resolução interna", en = "Internal resolution", es = "Resolución interna" }
help = { pt = "1x é a resolução original do PlayStation 2. 2x e 4x desenham o jogo com mais pixels: bordas e contornos ficam mais nítidos (as texturas continuam as do jogo). Custa mais da placa de vídeo: 2x serve para a maioria das placas; 4x pede uma placa forte. Precisa do motor 0.1.8 ou mais novo (gere o jogo de novo se ele for mais antigo).", en = "1x is the PlayStation 2's original resolution. 2x and 4x draw the game with more pixels: edges and outlines get sharper (textures stay the game's own). It costs more GPU: 2x suits most graphics cards; 4x needs a strong one. It needs engine 0.1.8 or newer (generate the game again if it is older).", es = "1x es la resolución original de PlayStation 2. 2x y 4x dibujan el juego con más píxeles: los bordes y contornos quedan más nítidos (las texturas siguen siendo las del juego). Cuesta más a la tarjeta de video: 2x sirve para la mayoría de las tarjetas; 4x pide una tarjeta potente. Necesita el motor 0.1.8 o más nuevo (genera el juego de nuevo si es más antiguo)." }
choices = [
  { value = "1", label = { pt = "1x (original)", en = "1x (original)", es = "1x (original)" } },
  { value = "2", label = "2x" },
  { value = "4", label = "4x" },
]

[[options]]
page = "video"
key = "PS2X_ESCALA"
target = "env"
type = "choice"
default = "nenhum"
label = { pt = "Escalonador", en = "Upscaler", es = "Escalador" }
help = { pt = "Como a imagem do PlayStation 2 é ampliada até a janela. Nenhum: pixels maiores, como no console. Bilinear: suaviza. FSR 1 (AMD) e NIS (NVIDIA Image Scaling): ampliação com nitidez, funcionam em qualquer placa de vídeo e custam pouco. O DLSS não está disponível: ele precisa de dados de movimento que os jogos de PlayStation 2 não fornecem.", en = "How the PlayStation 2's picture is enlarged to the window. None: bigger pixels, as on the console. Bilinear: smooths it. FSR 1 (AMD) and NIS (NVIDIA Image Scaling): sharp upscaling, they work on any graphics card and cost little. DLSS is not available: it needs motion data that PlayStation 2 games do not provide.", es = "Cómo se amplía la imagen de PlayStation 2 hasta la ventana. Ninguno: píxeles más grandes, como en la consola. Bilineal: la suaviza. FSR 1 (AMD) y NIS (NVIDIA Image Scaling): ampliación con nitidez, funcionan en cualquier tarjeta gráfica y cuestan poco. DLSS no está disponible: necesita datos de movimiento que los juegos de PlayStation 2 no proporcionan." }
choices = [
  { value = "nenhum", label = { pt = "Nenhum (padrão)", en = "None (default)", es = "Ninguno (por defecto)" } },
  { value = "bilinear", label = { pt = "Bilinear", en = "Bilinear", es = "Bilineal" } },
  { value = "fsr", label = "AMD FSR 1" },
  { value = "nis", label = "NVIDIA Image Scaling (NIS)" },
]

