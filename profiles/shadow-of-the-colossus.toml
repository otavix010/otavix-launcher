# Shadow of the Colossus (PlayStation 2) port: listed in the hub while it is made (no generator yet; the European SCES-53326)
[game]
title = "Shadow of the Colossus"
subtitle = { pt = "Port nativo do PlayStation 2 · recompilação estática", en = "Native PlayStation 2 port · static recompilation", es = "Port nativo de PlayStation 2 · recompilación estática" }
status = "wip"
status_text = { pt = "Em desenvolvimento", en = "In development", es = "En desarrollo" }
exe = "shadow-of-the-colossus.exe"
accent = [120, 140, 150]
legal = { pt = "O port lê a sua própria cópia do jogo. Shadow of the Colossus é marca dos seus donos; este projeto não tem relação com eles.", en = "The port reads your own copy of the game. Shadow of the Colossus is a trademark of its owners; this project is not affiliated with them.", es = "El port lee tu propia copia del juego. Shadow of the Colossus es marca de sus dueños; este proyecto no tiene relación con ellos." }

# pictures in arte/shadow-of-the-colossus when there are (capa, the library card; fundo, the page), else the public ones (libretro)
[art]
kind = "image"
folder = "../arte/shadow-of-the-colossus"
include = ["capa.png", "capa.jpg", "fundo.png", "fundo.jpg", "fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"]
card_only = 1
seconds = 12
trim = false
web = [
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Boxarts/Shadow%20of%20the%20Colossus%20%28USA%29.png",
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Titles/Shadow%20of%20the%20Colossus%20%28USA%29.png",
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Snaps/Shadow%20of%20the%20Colossus%20%28USA%29.png",
]

# the window's and the desktop shortcut's: a miniature of the box art (libretro)
[icon]
kind = "image"
web = ["https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Boxarts/Shadow%20of%20the%20Colossus%20%28USA%29.png"]
