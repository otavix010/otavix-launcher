help = { pt = "Suaviza os serrilhados da imagem final. Com a resolução interna em 2x ou 3x quase não é preciso.", en = "Smooths the final picture's jagged edges. With the internal resolution at 2x or 3x it is hardly needed.", es = "Suaviza los bordes dentados de la imagen final. Con la resolución interna a 2x o 3x casi no hace falta." }
choices = [
