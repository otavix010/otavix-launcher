  { value = "fxaa", label = "FXAA" },
  { value = "fxaa_extreme", label = { pt = "FXAA forte", en = "Strong FXAA", es = "FXAA fuerte" } },
]

[[options]]
page = "graphics"
key = "anisotropic_override"
type = "choice"
default = 5
label = { pt = "Filtro anisotrópico", en = "Anisotropic filtering", es = "Filtro anisotrópico" }
help = { pt = "Deixa as texturas nítidas vistas de lado (chão, paredes).", en = "Keeps textures sharp seen at an angle (floors, walls).", es = "Mantiene nítidas las texturas vistas de lado (suelo, paredes)." }
choices = [
  { value = -1, label = { pt = "Como o jogo pede", en = "As the game asks", es = "Como pide el juego" } },
  { value = 3, label = "4x" },
  { value = 4, label = "8x" },
  { value = 5, label = "16x" },
]

[[options]]
page = "graphics"
key = "alvos"
type = "choice"
default = "auto"
label = { pt = "Render targets", en = "Render targets", es = "Render targets" }
help = { pt = "Como a memória de vídeo do Xbox 360 (EDRAM) é imitada. A imagem costuma ser a mesma; o que muda é o trabalho da placa de vídeo, e qual caminho pesa menos depende do jogo. Automático usa o que foi medido melhor para este jogo. No Asura's Wrath, o ROV é bem mais leve (60 fps em 4K numa RTX 5080, contra 28 no RTV), mas acima de 1x deixa pontos verdes nas áreas muito escuras; o Automático usa o RTV, de imagem certa.", en = "How the Xbox 360's video memory (EDRAM) is imitated. The picture is usually the same; what changes is the graphics card's work, and which path is lighter depends on the game. Automatic uses the one measured best for this game. In Asura's Wrath, ROV is much lighter (60 fps at 4K on an RTX 5080, against 28 with RTV), but above 1x it leaves green specks in very dark areas; Automatic uses RTV, which is correct.", es = "Cómo se imita la memoria de vídeo de la Xbox 360 (EDRAM). La imagen suele ser la misma; lo que cambia es el trabajo de la tarjeta gráfica, y qué camino pesa menos depende del juego. Automático usa el que se midió mejor para este juego. En Asura's Wrath, ROV es mucho más ligero (60 fps en 4K en una RTX 5080, frente a 28 con RTV), pero por encima de 1x deja puntos verdes en las zonas muy oscuras; Automático usa RTV, de imagen correcta." }
choices = [
  { value = "auto", label = { pt = "Automático", en = "Automatic", es = "Automático" } },
  { value = "rov", label = "ROV" },
  { value = "rtv", label = "RTV" },
]

