step = 10
suffix = "%"
label = { pt = "Nitidez", en = "Sharpness", es = "Nitidez" }
help = { pt = "A nitidez do FSR ou do CAS. 0% é a mais suave.", en = "FSR's or CAS's sharpening. 0% is the softest.", es = "La nitidez de FSR o CAS. 0% es la más suave." }

[[options]]
