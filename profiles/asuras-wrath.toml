# Asura's Wrath (Xbox 360) port: made on the player's PC. The launcher downloads the port's code, the player points at
# their .iso, and the port's generator (gerar.ps1) fetches the tools (the ReXGlue SDK and a portable Clang), reads the
# game's executable from the .iso, translates its PowerPC code to C++ and compiles it there. The game then reads the
# .iso in place. Option keys are the port's own (asuraswrath.toml beside it, here opcoes.toml at the port's root).
[game]
title = "Asura's Wrath"
subtitle = { pt = "Port nativo do Xbox 360 · recompilação estática", en = "Native Xbox 360 port · static recompilation", es = "Port nativo de Xbox 360 · recompilación estática" }
exe = "out/build/win-amd64-release/asuraswrath.exe"
workdir = "exe"
port_file = "gerar.ps1"
game_file = "assets/default.xex"
settings = "opcoes.toml"
args = ["--game_data_root", "{dir}/assets", "--iso", "{iso}", "--user_data_root", "{dir}/saves", "--cache_root", "{dir}/cache"]
env = { PORT_OPCOES = "{dir}/opcoes.toml" }
logs = "out"
saves = ["saves"]
accent = [210, 110, 40]
legal = { pt = "O port lê a sua própria cópia do jogo: nada do jogo vem com ele, o código é gerado no seu PC. Asura's Wrath é marca da Capcom; este projeto não tem relação com ela nem com a Microsoft.", en = "The port reads your own copy of the game: none of the game ships with it, the code is made on your PC. Asura's Wrath is a trademark of Capcom; this project is not affiliated with Capcom or Microsoft.", es = "El port lee tu propia copia del juego: nada del juego viene con él, el código se genera en tu PC. Asura's Wrath es marca de Capcom; este proyecto no tiene relación con ella ni con Microsoft." }

[[pages]]
id = "video"
advanced = true
label = { pt = "Vídeo", en = "Video", es = "Vídeo" }

[[pages]]
id = "graphics"
advanced = true
label = { pt = "Gráficos", en = "Graphics", es = "Gráficos" }

[[pages]]
id = "audio"
advanced = true
label = { pt = "Áudio", en = "Audio", es = "Audio" }

[[pages]]
id = "controls"
advanced = true
label = { pt = "Controles", en = "Controls", es = "Controles" }

[[pages]]
id = "game"
advanced = true
label = { pt = "Jogo", en = "Game", es = "Juego" }

# what the port takes for a key its options file lacks
[defaults]
fullscreen = true
fps = 60
resolution_scale = 2
filtro = "fsr"
nitidez = 70
swap_post_effect = "none"
anisotropic_override = 5
alvos = "auto"
mostrar_fps = false
volume = 100
vibration = true
zona_morta_esquerda = 0
zona_morta_direita = 0
user_language = 1

# made on this PC by the port's generator, steps marked in out\gerar
[install]
kind = "build"
done = "out/gerar/5_jogar.ok"
marks = "out/gerar"
needs = "{iso}"  # the game reads the player's .iso in place: missing, it was moved or deleted (picked again, in seconds)
command = ["%SystemRoot%/System32/WindowsPowerShell/v1.0/powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "{dir}/gerar.ps1", "-Iso", "{iso}"]
redo = ["-RefazerDe", "3"]  # new code of the port: the translation and the build again, not the tools nor the .iso
version = { pt = "Asura's Wrath (World), a imagem .iso do disco do Xbox 360", en = "Asura's Wrath (World), the Xbox 360 disc's .iso image", es = "Asura's Wrath (World), la imagen .iso del disco de Xbox 360" }
time = { pt = "Leva de 5 a 20 minutos, conforme o processador, e só uma vez. Baixa uns 330 MB de ferramentas e precisa de uns 6 GB livres.", en = "It takes 5 to 20 minutes depending on the processor, and only once. It downloads about 330 MB of tools and needs about 6 GB free.", es = "Tarda de 5 a 20 minutos según el procesador, y solo una vez. Descarga unos 330 MB de herramientas y necesita unos 6 GB libres." }

[[install.prereqs]]
name = "Visual Studio Build Tools (C++ e CMake)"
check = "\"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.CMake.Project -property installationPath"
output = true
install = "winget install -e --id Microsoft.VisualStudio.2022.BuildTools --accept-package-agreements --accept-source-agreements --override \"--passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended\""
help = { pt = "Compila o jogo (uns 5 GB). Se o Build Tools já estiver instalado sem o CMake: abra o Visual Studio Installer, clique em Modificar e marque \"C++ CMake tools for Windows\".", en = "It compiles the game (about 5 GB). If Build Tools is installed without CMake: open the Visual Studio Installer, click Modify and tick \"C++ CMake tools for Windows\".", es = "Compila el juego (unos 5 GB). Si Build Tools ya está instalado sin CMake: abre el Visual Studio Installer, haz clic en Modificar y marca \"C++ CMake tools for Windows\"." }

[[install.inputs]]
key = "iso"
pick = "file"
filters = ["iso"]
label = { pt = "A imagem do disco (.iso)", en = "The disc image (.iso)", es = "La imagen del disco (.iso)" }
help = { pt = "O port lê a .iso direto, não copia os 8 GB: deixe o arquivo onde está.", en = "The port reads the .iso in place, it does not copy the 8 GB: leave the file where it is.", es = "El port lee la .iso directamente, no copia los 8 GB: deja el archivo donde está." }

[[install.steps]]
id = "1_ferramentas"
label = { pt = "ferramentas", en = "tools", es = "herramientas" }
[[install.steps]]
id = "2_jogo"
label = { pt = "executável do jogo", en = "the game's executable", es = "ejecutable del juego" }
[[install.steps]]
id = "3_traducao"
label = { pt = "tradução do código", en = "translating the code", es = "traducción del código" }
[[install.steps]]
id = "4_compilar"
label = { pt = "compilando", en = "compiling", es = "compilando" }
[[install.steps]]
id = "5_jogar"
label = { pt = "pronto para jogar", en = "ready to play", es = "listo para jugar" }

