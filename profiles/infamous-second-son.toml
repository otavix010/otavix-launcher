# inFAMOUS Second Son (PS4) on Windows: what the launcher shows. The port is a build of the shadPS4 emulator tuned for this one game
# (fixed effects, much more fps in the city, DLSS Frame Generation on RTX 40/50). Copied beside the launcher as launcher.toml.
# Option keys are environment variables of the emulator's process (target = "env") or the launcher's own state (target = "launcher").

[game]
title = "inFAMOUS Second Son"
subtitle = { pt = "Port para PC · emulador shadPS4 otimizado para o jogo", en = "PC port · shadPS4 emulator tuned for the game", es = "Port para PC · emulador shadPS4 optimizado para el juego" }
exe = "shadPS4.exe"
logs = "user/log"
# the report carries the emulator's own logs too: the newest file of user/log is Streamline's sl.log (report 392 came with only that)
report_files = ["user/log/shad_log.txt", "user/log/shadps4.log", "user/log/sl.log", "user/log/entrada.txt", "user/log/crash.txt"]
saves = ["user/home/1000/savedata/CUSA00004"]
game_file = "eboot.bin"
game_option = "game_path"
args = ["-g", "{game}"]
env = { SHADPS4_PIN_THREADS = "1" }
accent = [70, 150, 235]
legal = { pt = "Este launcher e o port não trazem nenhum arquivo do jogo. Eles leem a sua própria cópia de inFAMOUS Second Son (PS4, CUSA00004), já extraída numa pasta. inFAMOUS é marca da Sony Interactive Entertainment; este projeto não tem relação com ela.", en = "This launcher and the port ship no game files. They read your own copy of inFAMOUS Second Son (PS4, CUSA00004), already extracted into a folder. inFAMOUS is a trademark of Sony Interactive Entertainment; this project is not affiliated with it.", es = "Este launcher y el port no incluyen ningún archivo del juego. Leen tu propia copia de inFAMOUS Second Son (PS4, CUSA00004), ya extraída en una carpeta. inFAMOUS es marca de Sony Interactive Entertainment; este proyecto no tiene relación con ella." }

# the player's own copy of the game: the folder with eboot.bin; art from the player's copy (sce_sys)
[art]
kind = "image"
folder = "../arte/infamous-second-son"
include = ["icon0.png", "pic1.png"]
card_only = 1
seconds = 12
trim = false
# the game's own picture for every player, with or without the game (rule: scripts/conferir_arte.py); sent by espelho.py (ARTE)
web = ["https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/infamous-second-son/icon0.png", "https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/infamous-second-son/pic1.png"]

# the window's and the desktop shortcut's: the game's own icon (the player's copy; the public picture sent as art when there is none)
[icon]
files = ["{game}/sce_sys/icon0.png", "sce_sys/icon0.png"]
web = ["https://otavix-launcher.otavix-launcher-servidor.workers.dev/v1/arquivos/arte/infamous-second-son/icon0.png"]

# the player shows the folder (or the downloaded .7z/.zip/.rar): the launcher finds the folder holding eboot.bin, unpacking first if needed
[install]
check = "eboot.bin"
pkg = "CUSA00004"
version = { pt = "inFAMOUS Second Son (PS4, CUSA00004), já extraído, de preferência com o update 1.07", en = "inFAMOUS Second Son (PS4, CUSA00004), already extracted, preferably with the 1.07 update", es = "inFAMOUS Second Son (PS4, CUSA00004), ya extraído, de preferencia con el update 1.07" }

[performance]
note = { pt = "O emulador pesa no processador e na placa de vídeo. A geração de quadros do DLSS (RTX 40 e 50) dobra o fps exibido; sem uma RTX ela fica desligada sozinha. Na primeira vez a tela pode ficar preta por até 30 segundos enquanto os shaders são preparados, e cada efeito novo pode dar uma travadinha na primeira vez que aparece. Deixe o jogo e o port num SSD.", en = "The emulator weighs on both the processor and the graphics card. DLSS Frame Generation (RTX 40 and 50) doubles the displayed fps; without an RTX it turns itself off. The first time the screen may stay black for up to 30 seconds while the shaders are prepared, and each new effect may stutter the first time it shows. Keep the game and the port on an SSD.", es = "El emulador pesa en el procesador y en la tarjeta gráfica. La generación de cuadros de DLSS (RTX 40 y 50) duplica los fps mostrados; sin una RTX se desactiva sola. La primera vez la pantalla puede quedar negra hasta 30 segundos mientras se preparan los shaders, y cada efecto nuevo puede dar un tirón la primera vez que aparece. Deja el juego y el port en un SSD." }

[[pages]]
id = "game"
advanced = true
label = { pt = "Jogo", en = "Game", es = "Juego" }

[[pages]]
id = "video"
advanced = true
label = { pt = "Vídeo", en = "Video", es = "Vídeo" }

[[pages]]
id = "audio"
advanced = true
label = { pt = "Áudio", en = "Audio", es = "Audio" }

[[pages]]
id = "controls"
advanced = true
label = { pt = "Controles", en = "Controls", es = "Controles" }

[[options]]
page = "game"
key = "game_path"
type = "path"
pick = "folder"
label = { pt = "Pasta do jogo", en = "Game folder", es = "Carpeta del juego" }
help = { pt = "A pasta do inFAMOUS Second Son já extraída (CUSA00004), a que tem o eboot.bin dentro. Na página do jogo, mostre a pasta com os arquivos .pkg (ou os .pkg, ou um .7z/.zip/.rar) e o launcher extrai sozinho, com o update.", en = "The already extracted inFAMOUS Second Son folder (CUSA00004), the one with eboot.bin inside. On the game page, show the folder with the .pkg files (or the .pkg files, or a .7z/.zip/.rar) and the launcher extracts them by itself, update included.", es = "La carpeta de inFAMOUS Second Son ya extraída (CUSA00004), la que tiene eboot.bin dentro. En la página del juego, muestra la carpeta con los archivos .pkg (o los .pkg, o un .7z/.zip/.rar) y el launcher los extrae solo, con el update." }

[[options]]
page = "video"
key = "SHADPS4_FG"
target = "env"
type = "toggle"
default = true
label = { pt = "Geração de quadros (DLSS, RTX 40/50)", en = "Frame Generation (DLSS, RTX 40/50)", es = "Generación de cuadros (DLSS, RTX 40/50)" }
help = { pt = "Gera quadros intermediários na placa de vídeo e dobra o fps exibido. Só funciona em placas NVIDIA RTX 40 e 50 e com a janela do jogo na frente; nas outras ela se desliga sozinha.", en = "Makes in-between frames on the graphics card and doubles the displayed fps. It only works on NVIDIA RTX 40 and 50 cards and with the game window in front; on the others it turns itself off.", es = "Genera cuadros intermedios en la tarjeta gráfica y duplica los fps mostrados. Solo funciona en tarjetas NVIDIA RTX 40 y 50 y con la ventana del juego al frente; en las demás se desactiva sola." }

[[options]]
page = "video"
key = "SHADPS4_DLSS_AA"
target = "env"
type = "toggle"
default = false
label = { pt = "Antisserrilhamento DLSS (DLAA)", en = "DLSS anti-aliasing (DLAA)", es = "Antialiasing DLSS (DLAA)" }
help = { pt = "Suaviza as bordas com o DLSS, em placas NVIDIA RTX. Custa cerca de 10% do fps.", en = "Smooths edges with DLSS, on NVIDIA RTX cards. It costs about 10% of the fps.", es = "Suaviza los bordes con DLSS, en tarjetas NVIDIA RTX. Cuesta cerca del 10% de los fps." }

[[options]]
page = "video"
key = "SHADPS4_VBLANK_HZ"
target = "env"
type = "choice"
default = "360"
label = { pt = "Limite de fps", en = "Fps cap", es = "Límite de fps" }
help = { pt = "O jogo roda a 30 fps no console. 360 deixa o emulador livre para ir o mais alto que o PC aguentar; 60 limita.", en = "The game runs at 30 fps on the console. 360 lets the emulator go as high as the PC allows; 60 caps it.", es = "El juego corre a 30 fps en la consola. 360 deja al emulador ir tan alto como aguante el PC; 60 lo limita." }
choices = [
  { value = "60", label = "60" },
  { value = "120", label = "120" },
  { value = "360", label = { pt = "Livre (360)", en = "Uncapped (360)", es = "Libre (360)" } },
]

# ------------------------------------------------------------------------------------------------ vídeo (janela, sincronia, FSR)
# The entry (shadPS4.exe) writes SHADPS4_CFG_* into user/config.json before the emulator starts; the emulator itself reads only that file.

[[options]]
page = "video"
key = "SHADPS4_CFG_FULLSCREEN"
target = "env"
type = "toggle"
default = true
label = { pt = "Tela cheia", en = "Fullscreen", es = "Pantalla completa" }
help = { pt = "Liga a tela cheia sem borda. Desligada, o jogo abre numa janela do tamanho escolhido abaixo. A geração de quadros (DLSS) funciona nos dois modos, com a janela do jogo na frente.", en = "Turns on borderless fullscreen. Off, the game opens in a window of the size chosen below. Frame Generation (DLSS) works in both modes, with the game window in front.", es = "Activa la pantalla completa sin bordes. Desactivada, el juego abre en una ventana del tamaño elegido abajo. La generación de cuadros (DLSS) funciona en ambos modos, con la ventana del juego al frente." }

[[options]]
page = "video"
key = "SHADPS4_CFG_WINDOW"
target = "env"
type = "choice"
default = "1920x1080"
label = { pt = "Tamanho da janela", en = "Window size", es = "Tamaño de la ventana" }
help = { pt = "Só vale com a tela cheia desligada. O jogo desenha na resolução do PS4 (1080p) e a janela escala a imagem; com o FSR ligado a escala é mais nítida.", en = "Only applies with fullscreen off. The game draws at the PS4 resolution (1080p) and the window scales the picture; with FSR on the scaling is sharper.", es = "Solo vale con la pantalla completa desactivada. El juego dibuja a la resolución de PS4 (1080p) y la ventana escala la imagen; con FSR activado el escalado es más nítido." }
choices = [
  { value = "1280x720", label = "1280 × 720" },
  { value = "1600x900", label = "1600 × 900" },
  { value = "1920x1080", label = "1920 × 1080" },
  { value = "2560x1440", label = "2560 × 1440" },
  { value = "3840x2160", label = "3840 × 2160" },
]

[[options]]
page = "video"
key = "SHADPS4_CFG_VSYNC"
target = "env"
type = "choice"
default = "Mailbox"
label = { pt = "Sincronia vertical (VSync)", en = "Vertical sync (VSync)", es = "Sincronización vertical (VSync)" }
help = { pt = "Mailbox: sem rasgos na imagem e com pouco atraso (padrão). VSync (Fifo): sem rasgos, preso ao monitor. Imediato: sem sincronia, o menor atraso, mas pode rasgar a imagem.", en = "Mailbox: no tearing and low latency (default). VSync (Fifo): no tearing, locked to the monitor. Immediate: no sync, the lowest latency, but the picture can tear.", es = "Mailbox: sin cortes de imagen y poca latencia (predeterminado). VSync (Fifo): sin cortes, atado al monitor. Inmediato: sin sincronía, la menor latencia, pero la imagen puede cortarse." }
choices = [
  { value = "Mailbox", label = { pt = "Mailbox (padrão)", en = "Mailbox (default)", es = "Mailbox (predeterminado)" } },
  { value = "Fifo", label = "VSync (Fifo)" },
  { value = "Immediate", label = { pt = "Imediato (sem sincronia)", en = "Immediate (no sync)", es = "Inmediato (sin sincronía)" } },
]

[[options]]
page = "video"
key = "SHADPS4_CFG_FSR"
target = "env"
type = "toggle"
default = false
label = { pt = "Escala FSR 1 (AMD)", en = "FSR 1 scaling (AMD)", es = "Escalado FSR 1 (AMD)" }
help = { pt = "Amplia a imagem de 1080p do jogo para a janela ou a tela com o FSR 1, que fica mais nítido que a escala comum. Só faz diferença se a janela ou a tela for maior que 1080p. Funciona em qualquer placa de vídeo.", en = "Upscales the game's 1080p picture to the window or screen with FSR 1, sharper than plain scaling. It only matters if the window or screen is larger than 1080p. Works on any graphics card.", es = "Amplía la imagen de 1080p del juego a la ventana o pantalla con FSR 1, más nítido que el escalado común. Solo importa si la ventana o pantalla es mayor que 1080p. Funciona en cualquier tarjeta gráfica." }

[[options]]
page = "video"
key = "SHADPS4_CFG_SHARP"
target = "env"
type = "slider"
default = 90
min = 0
max = 100
step = 5
suffix = "%"
label = { pt = "Nitidez do FSR", en = "FSR sharpness", es = "Nitidez de FSR" }
help = { pt = "Quanto o FSR afia a imagem ampliada (RCAS). 0% desliga o afiamento. Só tem efeito com a Escala FSR 1 ligada.", en = "How much FSR sharpens the upscaled picture (RCAS). 0% turns sharpening off. Only has an effect with FSR 1 scaling on.", es = "Cuánto afila FSR la imagen ampliada (RCAS). 0% desactiva el afilado. Solo tiene efecto con el escalado FSR 1 activado." }

