key = "SHADPS4_CFG_MOTION"
target = "env"
type = "toggle"
default = true
label = { pt = "Giroscópio do controle", en = "Controller gyroscope", es = "Giroscopio del mando" }
help = { pt = "Liga o sensor de movimento do DualSense/DualShock. O jogo o usa para mirar a lata de spray de grafite e em alguns quebra-cabeças; sem esse controle, não faz diferença.", en = "Turns on the DualSense/DualShock motion sensor. The game uses it to aim the graffiti spray can and in a few puzzles; without that controller it makes no difference.", es = "Activa el sensor de movimiento del DualSense/DualShock. El juego lo usa para apuntar la lata de aerosol de grafiti y en algunos acertijos; sin ese mando, no cambia nada." }

[[options]]
