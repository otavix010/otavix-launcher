suffix = "%"
label = { pt = "Zona morta dos analógicos", en = "Stick dead zone", es = "Zona muerta de los analógicos" }
help = { pt = "Quanto o analógico precisa inclinar antes de contar. Suba se a câmera ou o personagem se mexe sozinho (controle com desgaste); o padrão do emulador é 4%.", en = "How far the stick must tilt before it counts. Raise it if the camera or character drifts by itself (a worn controller); the emulator's default is 4%.", es = "Cuánto debe inclinarse el analógico antes de contar. Súbalo si la cámara o el personaje se mueve solo (mando desgastado); el valor predeterminado del emulador es 4%." }

