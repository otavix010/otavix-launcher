label = { pt = "Fixar as threads nos núcleos", en = "Pin threads to cores", es = "Fijar los hilos a los núcleos" }
help = { pt = "Em processadores de até 6 núcleos com Hyper-Threading/SMT, põe cada parte pesada do jogo num núcleo físico só dela (num i5 de 4 núcleos, o processamento de geometria ficou 15 a 25% mais rápido). Em processadores maiores não muda nada. Se o jogo travar ou engasgar, teste Desligado.", en = "On processors with up to 6 cores and Hyper-Threading/SMT, puts each heavy part of the game on a physical core of its own (on a 4-core i5, geometry processing got 15 to 25% faster). On bigger processors it changes nothing. If the game stutters, try Off.", es = "En procesadores de hasta 6 núcleos con Hyper-Threading/SMT, pone cada parte pesada del juego en un núcleo físico propio (en un i5 de 4 núcleos, el procesamiento de geometría fue 15 a 25% más rápido). En procesadores más grandes no cambia nada. Si el juego se traba, prueba Desactivado." }
choices = [
  { value = "auto", label = { pt = "Automático (padrão)", en = "Automatic (default)", es = "Automático (por defecto)" } },
  { value = "0", label = { pt = "Desligado", en = "Off", es = "Desactivado" } },
]

