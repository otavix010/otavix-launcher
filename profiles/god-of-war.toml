# God of War (PlayStation 2) port: made on the player's PC by the port's generator (gerar.ps1 of otavix010/god-of-war-pc),
# from their own DVD image (the US SCUS-97399). The game's own variables (jogo.json "ambiente") go in bin\ambiente.txt,
# which the runtime reads; the launcher only passes the disc and the menu's options. In development.
[game]
title = "God of War"
subtitle = { pt = "Port nativo do PlayStation 2 · recompilação estática", en = "Native PlayStation 2 port · static recompilation", es = "Port nativo de PlayStation 2 · recompilación estática" }
status = "wip"
status_text = { pt = "Em desenvolvimento", en = "In development", es = "En desarrollo" }
exe = "bin/god-of-war.exe"
workdir = "trabalho/disc"  # as jogar.cmd: the game opens its files from the disc's folder
port_file = "gerar.ps1"
args = ["{dir}/trabalho/disc/SCUS_973.99"]
# the ISO picked when making it (the game reads its sectors) and the disc's files; the rest comes from bin\ambiente.txt
env = { PS2X_CD_IMAGE = "{iso}", PS2X_CD_ROOT = "{dir}/trabalho/disc" }
log_file = "out/jogo.log"
logs = "out"
accent = [170, 25, 20]
legal = { pt = "O port lê a sua própria cópia do jogo. God of War é marca dos seus donos; este projeto não tem relação com eles.", en = "The port reads your own copy of the game. God of War is a trademark of its owners; this project is not affiliated with them.", es = "El port lee tu propia copia del juego. God of War es marca de sus dueños; este proyecto no tiene relación con ellos." }

[performance]
note = { pt = "God of War roda a 60 fps em PCs atuais. Em notebooks e PCs fracos, use a predefinição Notebook / PC fraco (30 fps estáveis): num i5 de 4 núcleos com GTX 1650, o modo 30 fica entre 29 e 30 fps nas cenas pesadas. O que mais pesa é o processador: o port traduz o código do PlayStation 2 (incluindo o processador de geometria, o VU1) para o seu PC.", en = "God of War runs at 60 fps on current PCs. On laptops and weak PCs, use the Laptop / weak PC preset (steady 30 fps): on a 4-core i5 with a GTX 1650, 30 fps mode stays between 29 and 30 fps in heavy scenes. What weighs most is the processor: the port translates the PlayStation 2's code (including its geometry processor, the VU1) for your PC.", es = "God of War va a 60 fps en PC actuales. En portátiles y PC débiles, usa el preajuste Portátil / PC débil (30 fps estables): en un i5 de 4 núcleos con GTX 1650, el modo 30 se mantiene entre 29 y 30 fps en escenas pesadas. Lo que más pesa es el procesador: el port traduce el código de PlayStation 2 (incluido su procesador de geometría, la VU1) para tu PC." }

# pictures in arte/god-of-war when there are (capa, the library card; fundo, the page), else the public ones (libretro)
[art]
kind = "image"
folder = "../arte/god-of-war"
include = ["capa.png", "capa.jpg", "fundo.png", "fundo.jpg", "fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"]
card_only = 1
seconds = 12
trim = false
web = [
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Boxarts/God%20of%20War%20%28USA%29.png",
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Titles/God%20of%20War%20%28USA%29.png",
  "https://thumbnails.libretro.com/Sony%20-%20PlayStation%202/Named_Snaps/God%20of%20War%20%28USA%29.png",
]

[install]
kind = "build"
done = "out/gerar/7_jogar.ok"
marks = "out/gerar"
command = ["%SystemRoot%/System32/WindowsPowerShell/v1.0/powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "{dir}/gerar.ps1", "-Iso", "{iso}"]
redo = ["-RefazerDe", "3"]  # new code of the port: its PS2Recomp fixes, the translation, the VU1 and the build again, not the disc
version = { pt = "God of War dos EUA (SCUS-97399): a imagem .iso do DVD do PlayStation 2", en = "God of War, US (SCUS-97399): the PlayStation 2 DVD's .iso image", es = "God of War de EE. UU. (SCUS-97399): la imagen .iso del DVD de PlayStation 2" }
time = { pt = "Leva de alguns minutos a meia hora, conforme o processador, e só uma vez. Baixa e compila o PS2Recomp. Precisa de um processador com AVX2.", en = "It takes from a few minutes to half an hour depending on the processor, and only once. It downloads and builds PS2Recomp. It needs a processor with AVX2.", es = "Tarda de unos minutos a media hora según el procesador, y solo una vez. Descarga y compila PS2Recomp. Necesita un procesador con AVX2." }

[[install.prereqs]]
name = "Python 3.11"
check = "python -c \"import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)\""
install = "(where winget >nul 2>&1 && winget install -e --id Python.Python.3.12 --accept-package-agreements --accept-source-agreements) || (echo Sem o winget: baixando o instalador oficial do python.org... && curl -L --fail -o \"%TEMP%\\python-3.12.10-amd64.exe\" https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe && \"%TEMP%\\python-3.12.10-amd64.exe\" /passive InstallAllUsers=0 PrependPath=1 Include_launcher=1)"
help = { pt = "Traduz o código do jogo. Depois de instalar, clique em Conferir de novo.", en = "It translates the game's code. Once installed, click Check again.", es = "Traduce el código del juego. Después de instalarlo, haz clic en Comprobar de nuevo." }

[[install.prereqs]]
name = "Visual Studio Build Tools (C++ e CMake)"
check = "\"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.CMake.Project -property installationPath"
output = true
install = "(where winget >nul 2>&1 && winget install -e --id Microsoft.VisualStudio.2022.BuildTools --accept-package-agreements --accept-source-agreements --override \"--passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended\") || (echo Sem o winget: baixando o instalador oficial da Microsoft... && curl -L --fail -o \"%TEMP%\\vs_BuildTools.exe\" https://aka.ms/vs/17/release/vs_BuildTools.exe && \"%TEMP%\\vs_BuildTools.exe\" --passive --wait --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.CMake.Project --includeRecommended)"
help = { pt = "Compila o jogo (uns 6 GB). Se o Build Tools já estiver instalado sem o CMake: abra o Visual Studio Installer, clique em Modificar e marque \"C++ CMake tools\".", en = "It compiles the game (about 6 GB). If Build Tools is installed without CMake: open the Visual Studio Installer, click Modify and tick \"C++ CMake tools\".", es = "Compila el juego (unos 6 GB). Si Build Tools ya está instalado sin CMake: abre el Visual Studio Installer, haz clic en Modificar y marca \"C++ CMake tools\"." }

[[install.inputs]]
key = "iso"
pick = "both"
filters = ["7z", "zip", "rar", "iso"]
unpack = "*.iso"
label = { pt = "A imagem do DVD (.iso, ou o .7z/.zip/.rar baixado)", en = "The DVD image (.iso, or the downloaded .7z/.zip/.rar)", es = "La imagen del DVD (.iso, o el .7z/.zip/.rar descargado)" }
help = { pt = "Tem que ser a versão dos EUA (SCUS-97399). O gerador confere o executável do jogo e avisa se for outra versão. O jogo lê a ISO enquanto roda: deixe-a onde está. Um arquivo .7z, .zip ou .rar com a .iso dentro (ou a pasta onde ele está) também serve: o launcher extrai a .iso na pasta do port antes de gerar.", en = "It must be the US release (SCUS-97399). The generator checks the game's executable and says so when it is another version. The game reads the ISO while it runs: leave it where it is. A .7z, .zip or .rar holding the .iso (or the folder it is in) works too: the launcher unpacks the .iso into the port's folder before making the game.", es = "Tiene que ser la versión de EE. UU. (SCUS-97399). El generador comprueba el ejecutable del juego y avisa si es otra versión. El juego lee la ISO mientras se ejecuta: déjala donde está. Un archivo .7z, .zip o .rar con la .iso dentro (o la carpeta donde está) también sirve: el launcher extrae la .iso en la carpeta del port antes de generar." }

