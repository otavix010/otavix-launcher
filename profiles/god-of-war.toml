help = { pt = "O tamanho em que a janela abre (em tela cheia vale a resolução do monitor). O jogo desenha na resolução do PlayStation 2 e a imagem é ampliada até a janela: para a ampliação ficar mais nítida, use o Escalonador abaixo.", en = "The size the window opens at (in fullscreen, the monitor's resolution is used). The game draws at the PlayStation 2's resolution and the picture is enlarged to the window: for a sharper enlargement, use the Upscaler below.", es = "El tamaño con el que se abre la ventana (en pantalla completa vale la resolución del monitor). El juego dibuja a la resolución de PlayStation 2 y la imagen se amplía hasta la ventana: para una ampliación más nítida, usa el Escalador de abajo." }
choices = [
  { value = "1280x720", label = "1280 × 720" },
  { value = "1600x900", label = "1600 × 900" },
  { value = "1920x1080", label = "1920 × 1080" },
  { value = "2560x1440", label = "2560 × 1440" },
  { value = "3840x2160", label = "3840 × 2160" },
]

[[options]]
page = "video"
key = "PS2X_ESCALA"
target = "env"
type = "choice"
default = "nenhum"
label = { pt = "Escalonador", en = "Upscaler", es = "Escalador" }
help = { pt = "Como a imagem do PlayStation 2 é ampliada até a janela. Nenhum: pixels maiores, como no console. Bilinear: suaviza. FSR 1 (AMD) e NIS (NVIDIA Image Scaling): ampliação com nitidez, funcionam em qualquer placa de vídeo e custam pouco. O DLSS não está disponível: ele precisa de dados de movimento que os jogos de PlayStation 2 não fornecem.", en = "How the PlayStation 2's picture is enlarged to the window. None: bigger pixels, as on the console. Bilinear: smooths it. FSR 1 (AMD) and NIS (NVIDIA Image Scaling): sharp upscaling, they work on any graphics card and cost little. DLSS is not available: it needs motion data that PlayStation 2 games do not provide.", es = "Cómo se amplía la imagen de PlayStation 2 hasta la ventana. Ninguno: píxeles más grandes, como en la consola. Bilineal: la suaviza. FSR 1 (AMD) y NIS (NVIDIA Image Scaling): ampliación con nitidez, funcionan en cualquier tarjeta gráfica y cuestan poco. DLSS no está disponible: necesita datos de movimiento que los juegos de PlayStation 2 no proporcionan." }
choices = [
  { value = "nenhum", label = { pt = "Nenhum (padrão)", en = "None (default)", es = "Ninguno (por defecto)" } },
  { value = "bilinear", label = { pt = "Bilinear", en = "Bilinear", es = "Bilineal" } },
  { value = "fsr", label = "AMD FSR 1" },
  { value = "nis", label = "NVIDIA Image Scaling (NIS)" },
]

[[options]]
page = "video"
key = "PS2X_NITIDEZ_PCT"
target = "env"
type = "slider"
default = 50
min = 0
max = 100
step = 5
suffix = "%"
label = { pt = "Nitidez do escalonador", en = "Upscaler sharpness", es = "Nitidez del escalador" }
help = { pt = "Quanto o FSR 1 ou o NIS realçam as bordas. Valores altos deixam a imagem mais definida, mas podem destacar o serrilhado.", en = "How much FSR 1 or NIS bring out the edges. High values make the picture crisper but can bring out jagged edges.", es = "Cuánto realzan los bordes FSR 1 o NIS. Los valores altos dejan la imagen más definida, pero pueden resaltar el dentado." }

