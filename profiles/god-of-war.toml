  { value = "21:9", label = { pt = "21:9 (ultrawide)", en = "21:9 (ultrawide)", es = "21:9 (ultrawide)" } },
  { value = "32:9", label = { pt = "32:9 (super ultrawide)", en = "32:9 (super ultrawide)", es = "32:9 (super ultrawide)" } },
