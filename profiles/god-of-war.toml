key = "PS2X_TELA_CHEIA"
target = "env"
type = "choice"
default = "0"
label = { pt = "Modo de tela", en = "Display mode", es = "Modo de pantalla" }
help = { pt = "Janela ou tela cheia sem bordas. No jogo, F11 ou Alt+Enter alternam entre os dois.", en = "A window or borderless fullscreen. In game, F11 or Alt+Enter switch between them.", es = "Ventana o pantalla completa sin bordes. En el juego, F11 o Alt+Enter alternan entre los dos." }
choices = [
  { value = "0", label = { pt = "Janela", en = "Window", es = "Ventana" } },
  { value = "1", label = { pt = "Tela cheia", en = "Fullscreen", es = "Pantalla completa" } },
]

[[options]]
page = "video"
key = "PS2X_JANELA_TAM"
target = "env"
