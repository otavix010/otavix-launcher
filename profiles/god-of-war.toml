[[options]]
page = "video"
key = "PS2X_QPS"
target = "env"
type = "choice"
default = "60"
label = { pt = "Taxa de quadros", en = "Frame rate", es = "Tasa de fotogramas" }
help = { pt = "60 fps é o modo original do jogo. 30 fps usa o limitador do próprio jogo: em PCs mais fracos e notebooks, deixa o ritmo estável em vez de oscilar entre 20 e 30. O jogo continua na velocidade certa nos dois modos.", en = "60 fps is the game's original mode. 30 fps uses the game's own limiter: on weaker PCs and laptops, it keeps the pace steady instead of swinging between 20 and 30. The game runs at the right speed in both modes.", es = "60 fps es el modo original del juego. 30 fps usa el limitador del propio juego: en PC más débiles y portátiles, mantiene el ritmo estable en lugar de oscilar entre 20 y 30. El juego va a la velocidad correcta en los dos modos." }
choices = [
  { value = "60", label = { pt = "60 fps (original)", en = "60 fps (original)", es = "60 fps (original)" } },
  { value = "30", label = { pt = "30 fps (PCs fracos e notebooks)", en = "30 fps (weaker PCs and laptops)", es = "30 fps (PC débiles y portátiles)" } },
]

[[options]]
