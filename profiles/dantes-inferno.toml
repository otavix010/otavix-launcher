help = { pt = "Como a imagem chega à resolução do monitor. FSR 1 (AMD) amplia com bordas nítidas; CAS (AMD) só dá nitidez; FSR 3 usa os quadros anteriores, com movimento estimado (os jogos do Xbox 360 não fornecem o real), e pode deixar rastros: experimental; bilinear é a ampliação simples. DLSS e XeSS precisam do movimento real.", en = "How the picture reaches the monitor's resolution. FSR 1 (AMD) upscales with crisp edges; CAS (AMD) only sharpens; FSR 3 uses the previous frames with estimated motion (Xbox 360 games don't give the real one) and may leave trails: experimental; bilinear is the plain upscale. DLSS and XeSS need the real motion.", es = "Cómo llega la imagen a la resolución del monitor. FSR 1 (AMD) amplía con bordes nítidos; CAS (AMD) solo da nitidez; FSR 3 usa los fotogramas anteriores con movimiento estimado (los juegos de Xbox 360 no dan el real) y puede dejar estelas: experimental; bilineal es el escalado simple. DLSS y XeSS necesitan el movimiento real." }
choices = [
  { value = "fsr", label = "AMD FidelityFX FSR 1" },
  { value = "cas", label = "AMD FidelityFX CAS" },
  { value = "fsr3", label = { pt = "AMD FidelityFX FSR 3 (temporal, experimental)", en = "AMD FidelityFX FSR 3 (temporal, experimental)", es = "AMD FidelityFX FSR 3 (temporal, experimental)" } },
  { value = "bilinear", label = { pt = "Bilinear", en = "Bilinear", es = "Bilineal" } },
]

