# Dante's Inferno (Xbox 360) port: listed in the hub while it is made.
[game]
title = "Dante's Inferno"
subtitle = { pt = "Port nativo do Xbox 360 · recompilação estática", en = "Native Xbox 360 port · static recompilation", es = "Port nativo de Xbox 360 · recompilación estática" }
status = "wip"
status_text = { pt = "Em desenvolvimento", en = "In development", es = "En desarrollo" }
exe = "dante.exe"
accent = [175, 35, 25]
legal = { pt = "O port lê a sua própria cópia do jogo. Dante's Inferno é marca da Electronic Arts; este projeto não tem relação com ela.", en = "The port reads your own copy of the game. Dante's Inferno is a trademark of Electronic Arts; this project is not affiliated with it.", es = "El port lee tu propia copia del juego. Dante's Inferno es marca de Electronic Arts; este proyecto no tiene relación con ella." }

# pictures in arte/dantes-inferno: capa (the library card) and fundo, fundo1-4 (the page's background)
[art]
kind = "image"
folder = "../arte/dantes-inferno"
include = ["capa.png", "capa.jpg", "fundo.png", "fundo.jpg", "fundo1.png", "fundo2.png", "fundo3.png", "fundo4.png"]
card_only = 1
seconds = 12
trim = false
