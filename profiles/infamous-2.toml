# inFAMOUS 2 (PS3) port: listed in the hub while it is made.
[game]
title = "inFAMOUS 2"
subtitle = { pt = "Port nativo do PS3 · recompilação estática", en = "Native PS3 port · static recompilation", es = "Port nativo de PS3 · recompilación estática" }
status = "wip"
status_text = { pt = "Em desenvolvimento", en = "In development", es = "En desarrollo" }
exe = "infamous2.exe"
accent = [235, 120, 40]
legal = { pt = "O port lê a sua própria cópia do jogo. inFAMOUS é marca da Sony Interactive Entertainment; este projeto não tem relação com ela.", en = "The port reads your own copy of the game. inFAMOUS is a trademark of Sony Interactive Entertainment; this project is not affiliated with it.", es = "El port lee tu propia copia del juego. inFAMOUS es marca de Sony Interactive Entertainment; este proyecto no tiene relación con ella." }

# the official art, from the player's own copy (PS3_GAME): the icon for the card, the background for the page
[art]
kind = "image"
folder = "../arte/infamous-2"
include = ["PS3_GAME/ICON0.PNG", "PS3_GAME/PIC1.PNG"]
card_only = 1
seconds = 12
trim = false

# public pictures (a store's box and background), until the player's copy gives its own
web = [
  "https://art.gametdb.com/ps3/coverHQ/US/BCUS98125.jpg",
]